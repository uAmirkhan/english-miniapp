<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5fb; --card: #fff; --fg: #1c1d2b; --mut: #6b6f85; --line: #e6e8f2;
  --acc: #3b4fe4; --acc-2: #7b4dff; --acc-soft: #e4e8ff; --ok: #1f9d64; --bad: #d64545;
  --teal-bg: #d8f2f1; --teal: #0f7c80; --violet-bg: #ece3fc; --violet: #7a3fe0;
  --indigo-bg: #e2e6fc; --indigo: #3346d3; --green-bg: #dbf0e4; --green: #1d7a4f;
  --pink-bg: #fde3ee; --pink: #c2185b; --orange-bg: #ffe8d4; --orange: #d9601a;
  --shadow: 0 1px 2px rgba(28, 29, 43, .04), 0 6px 18px rgba(28, 29, 43, .06);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #111219; --card: #1b1d28; --fg: #eef0fb; --mut: #9a9db4; --line: #2a2d3d;
  --acc: #7086ff; --acc-2: #a07bff; --acc-soft: #252a4a; --ok: #46c98a; --bad: #ff6b6b;
  --teal-bg: #15302f; --teal: #5fd0cb; --violet-bg: #2a2140; --violet: #b996ff;
  --indigo-bg: #1f2547; --indigo: #8d9cff; --green-bg: #16301f; --green: #63d095;
  --pink-bg: #3a1a29; --pink: #ff7fb0; --orange-bg: #3a2414; --orange: #ffa25f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 15px/1.45 Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 4px; line-height: 1.15; }
h2 { font-size: 21px; font-weight: 800; margin: 26px 0 12px; letter-spacing: -.01em; }
h3 { font-size: 17px; font-weight: 700; margin: 0; }
p { margin: 0; }
.mut { color: var(--mut); font-size: 13.5px; }
.lead { color: var(--mut); font-size: 16px; }
.hidden { display: none !important; }
.ic { width: 24px; height: 24px; flex: none; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:disabled { opacity: .55; cursor: default; }

/* появление карточек */
.in > * { animation: up .38s cubic-bezier(.2, .8, .2, 1) both; }
.in > *:nth-child(2) { animation-delay: .04s; } .in > *:nth-child(3) { animation-delay: .08s; }
.in > *:nth-child(4) { animation-delay: .12s; } .in > *:nth-child(5) { animation-delay: .16s; }
.in > *:nth-child(n+6) { animation-delay: .2s; }
@keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .in > * { animation: none; } }
.press { transition: transform .12s ease; }
.press:active { transform: scale(.97); }

.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: var(--card); box-shadow: var(--shadow); font-weight: 700; font-size: 14px; white-space: nowrap; }
.pill .ic { width: 16px; height: 16px; }

.card { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); margin: 12px 0; }
.err { border-left: 4px solid var(--bad); }
.err b { color: var(--bad); }

/* плитки 2x2 */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.tile { position: relative; overflow: hidden; text-align: left; border-radius: 24px; padding: 16px 14px 18px; min-height: 172px; background: var(--t-bg); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .06); }
.tile::after { content: ""; position: absolute; width: 110px; height: 110px; border-radius: 50%; right: -30px; top: -34px; background: var(--t-fg); opacity: .09; }
.tile .sq { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--t-fg); color: #fff; margin-bottom: 16px; box-shadow: 0 6px 14px color-mix(in srgb, var(--t-fg) 35%, transparent); }
.tile .sq .ic { width: 28px; height: 28px; }
.tile h3 { font-size: 16.5px; line-height: 1.2; margin-bottom: 4px; }
.tile p { color: color-mix(in srgb, var(--fg) 70%, var(--t-bg)); font-size: 13.5px; line-height: 1.3; }
.c-teal { --t-bg: var(--teal-bg); --t-fg: var(--teal); } .c-violet { --t-bg: var(--violet-bg); --t-fg: var(--violet); }
.c-indigo { --t-bg: var(--indigo-bg); --t-fg: var(--indigo); } .c-green { --t-bg: var(--green-bg); --t-fg: var(--green); }
.c-pink { --t-bg: var(--pink-bg); --t-fg: var(--pink); } .c-orange { --t-bg: var(--orange-bg); --t-fg: var(--orange); }

/* строки сценариев */
.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); margin: 10px 0; }
.row .dot { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--t-bg); color: var(--t-fg); flex: none; }
.row .tx { flex: 1; min-width: 0; }
.row .tx p { color: var(--mut); font-size: 14px; line-height: 1.35; margin-top: 2px; }
.badge { flex: none; font-size: 13px; font-weight: 700; padding: 5px 11px; border-radius: 99px; background: var(--acc-soft); color: var(--acc); }
.badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }

/* главная */
.hero { position: relative; overflow: hidden; color: #fff; border-radius: 26px; padding: 20px; margin-top: 14px; background: linear-gradient(135deg, #3b4fe4 0%, #7b4dff 100%); box-shadow: 0 12px 28px rgba(80, 70, 230, .3); }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .1); }
.hero::before { width: 180px; height: 180px; right: -50px; top: -70px; }
.hero::after { width: 120px; height: 120px; right: 60px; bottom: -70px; }
.hero .big { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.hero .sub { opacity: .85; font-size: 14px; }
.hero .stats { display: flex; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
.hero .stat { flex: 1; background: rgba(255, 255, 255, .16); border-radius: 16px; padding: 10px 12px; }
.hero .stat b { display: block; font-size: 20px; }
.hero .stat span { font-size: 12.5px; opacity: .85; }
.delta { display: inline-block; font-size: 14px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgba(255, 255, 255, .22); vertical-align: middle; margin-left: 8px; }
.todo { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.todo:last-child { border-bottom: 0; padding-bottom: 2px; } .todo:first-child { padding-top: 2px; }
.todo .chk { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); color: transparent; flex: none; }
.todo.done .chk { background: var(--ok); border-color: var(--ok); color: #fff; }
.todo .chk .ic { width: 16px; height: 16px; }
.todo .tx { flex: 1; } .todo .tx p { color: var(--mut); font-size: 13px; }
.todo button { font-weight: 700; color: var(--acc); background: var(--acc-soft); border-radius: 99px; padding: 7px 14px; font-size: 14px; }
.ring { display: flex; align-items: center; gap: 16px; }
.ring svg { width: 92px; height: 92px; flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .bgc { stroke: var(--acc-soft); }
.ring .fgc { stroke: url(#rg); stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2, .8, .2, 1); }
.ring .num { font-size: 34px; font-weight: 800; line-height: 1; }
.rank { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--orange-bg); color: var(--orange); }
.rank .ic { width: 15px; height: 15px; }

/* прогресс */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kpi { background: var(--card); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); }
.kpi .ic { color: var(--t-fg); width: 22px; height: 22px; margin-bottom: 8px; }
.kpi b { font-size: 26px; font-weight: 800; display: block; line-height: 1.1; }
.chart { width: 100%; height: 130px; display: block; margin-top: 10px; overflow: visible; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ach div { border-radius: 16px; padding: 12px; background: var(--bg); font-size: 13.5px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.ach .ic { width: 22px; height: 22px; flex: none; }
.ach .got { background: var(--orange-bg); } .ach .got .ic { color: var(--orange); }
.ach .no { opacity: .55; } .ach span { display: block; font-weight: 500; color: var(--mut); font-size: 12px; }

/* задания */
.task p.q { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); border-radius: 99px; padding: 9px 16px; font-weight: 700; background: var(--card); }
.chip.on { background: var(--acc); color: #fff; border-color: var(--acc); }
input, textarea { width: 100%; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); outline: none; }
input:focus, textarea:focus { border-color: var(--acc); }
textarea { min-height: 76px; resize: vertical; }
.res { margin-top: 8px; font-size: 14px; min-height: 1em; font-weight: 600; }
.up { color: var(--ok); } .down { color: var(--bad); }
.timer { font-size: 56px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; margin: 4px 0 10px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px; border-radius: 18px; font-weight: 800; font-size: 16px; background: var(--acc); color: #fff; box-shadow: 0 8px 20px color-mix(in srgb, var(--acc) 35%, transparent); }
.btn.soft { background: var(--acc-soft); color: var(--acc); box-shadow: none; }
.btn .ic { width: 20px; height: 20px; }
.bar { height: 10px; border-radius: 6px; background: var(--acc-soft); overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--acc), var(--acc-2)); transition: width .6s ease; }
.cards-hero { display: flex; align-items: center; gap: 14px; }
.cards-hero .num { font-size: 40px; font-weight: 800; line-height: 1; }

/* нижнее меню */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
nav div { max-width: 560px; margin: 0 auto; display: flex; }
nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--mut); padding: 4px 0; }
nav button .ic { width: 26px; height: 26px; transition: transform .2s; }
nav button.on { color: var(--acc); } nav button.on .ic { transform: translateY(-2px); }

/* шторка */
.veil { position: fixed; inset: 0; z-index: 10; background: rgba(10, 12, 30, .45); opacity: 0; pointer-events: none; transition: opacity .25s; }
.veil.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 88vh; overflow-y: auto; background: var(--card); border-radius: 28px 28px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
.sheet.open { transform: none; }
.sheet > div { max-width: 560px; margin: 0 auto; }
.sheet .x { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--mut); background: var(--bg); flex: none; }
.sheet h1 { font-size: 26px; margin: 0; }
.sheet .cap { font-size: 12.5px; font-weight: 800; letter-spacing: .06em; color: var(--mut); text-transform: uppercase; margin: 20px 0 8px; }
.goal { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; font-size: 15.5px; }
.goal .ic { width: 20px; height: 20px; color: var(--ok); margin-top: 1px; }
.lvl { display: flex; gap: 8px; flex-wrap: wrap; }
.lvl .chip { padding: 10px 18px; }
.note { margin: 18px 0 16px; font-size: 14px; color: var(--mut); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 20; max-width: 528px; margin: 0 auto; background: #1c1d2b; color: #fff; padding: 13px 16px; border-radius: 16px; font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); opacity: 0; transform: translateY(10px); transition: .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
:root[data-theme="dark"] .toast { background: #343a66; }
</style>
</head>

const TG = window.Telegram && Telegram.WebApp;
const IN_TG = !!(TG && TG.platform && TG.platform !== "unknown");

const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ───────────── тема: Telegram сам говорит, светлая или темная
function theme() {
  const dark = IN_TG ? TG.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (IN_TG) {
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    try { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } catch (e) { /* старый клиент */ }
  }
}
if (IN_TG) { TG.ready(); TG.expand(); TG.onEvent("themeChanged", theme); }
theme();

const haptic = (k = "light") => { try { IN_TG && TG.HapticFeedback.impactOccurred(k); } catch (e) {} };
function toast(msg, ms = 4200) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), ms);
}
function showErr(list) {
  ERRS.push(...list);
  $("#errs").innerHTML = ERRS.length ? `<div class="card err"><b>Ошибки данных</b><br>${ERRS.map(esc).join("<br>")}</div>` : "";
}

// sendData закрывает мини-апп, бот отвечает в чате. Работает только из кнопки внизу чата.
function send(obj, what) {
  const payload = JSON.stringify(obj);
  const bytes = new Blob([payload]).size;
  if (bytes > LIMIT) { toast(`Слишком длинно: ${bytes} байт из ${LIMIT}. Сократи текст.`); return false; }
  if (!IN_TG) { toast(`Страница открыта не из Telegram. ${what} работает из кнопки «📊 Прогресс» внизу чата бота.`); return false; }
  try { haptic("medium"); TG.sendData(payload); }
  catch (e) { toast(`Не отправилось: ${e.message || e}. Открой мини-апп кнопкой «📊 Прогресс» внизу чата.`); return false; }
  setTimeout(() => toast("Telegram не закрыл окно, значит команда не ушла. Открой мини-апп кнопкой «📊 Прогресс» внизу чата, не под сообщением.", 7000), 4000);
  return true;
}

async function decode(z) {
  const b64 = z.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((z.length + 3) % 4);
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  if (!("DecompressionStream" in window)) throw new Error("этот Telegram слишком старый: нет DecompressionStream, обнови приложение");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

// ───────────── вкладки
const TABS = { home: ["house", "Главная"], learn: ["book-open", "Учить"], practice: ["mic", "Практика"], stats: ["chart-line", "Прогресс"] };
$$("nav button").forEach((b) => {
  const [i, t] = TABS[b.dataset.tab]; b.innerHTML = ic(i) + t;
  b.onclick = () => { haptic(); tab(b.dataset.tab); };
});
function tab(name) {
  TAB = name;
  $$("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  for (const k of Object.keys(TABS)) {
    const el = $("#" + k); el.classList.toggle("hidden", k !== name);
    if (k === name) { el.classList.remove("in"); void el.offsetWidth; el.classList.add("in"); }
  }
  scrollTo({ top: 0 });
}

// ───────────── графики
function chart(values, labels, { suffix = "", max = null, min = null, area = false } = {}) {
  const pts = values.map((v, i) => [i, v]).filter(([, v]) => v !== null && v !== undefined);
  if (!pts.length) return `<p class="mut" style="margin-top:8px">Пока нет данных.</p>`;
  const W = 300, H = 120, P = 14;
  const lo = min ?? Math.min(...pts.map((p) => p[1])), hi = max ?? Math.max(...pts.map((p) => p[1]));
  const span = hi - lo || 1, n = Math.max(values.length - 1, 1);
  const xy = pts.map(([i, v]) => [P + (i / n) * (W - 2 * P), H - 22 - ((v - lo) / span) * (H - 22 - P)]);
  const line = xy.map((p) => p.map((x) => x.toFixed(1)).join(",")).join(" ");
  const last = xy[xy.length - 1], lv = pts[pts.length - 1][1];
  const fill = area && xy.length > 1 ? `<polygon fill="url(#ag)" points="${xy[0][0]},${H - 22} ${line} ${last[0]},${H - 22}"/>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${fill}
    <polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${line}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--card)" stroke="var(--acc)" stroke-width="3" vector-effect="non-scaling-stroke"/>
    <text x="${Math.min(last[0], W - 44)}" y="${Math.max(last[1] - 10, 12)}" font-size="13" font-weight="800" fill="var(--fg)">${esc(lv)}${suffix}</text>
    <text x="${P}" y="${H - 4}" font-size="11" fill="var(--mut)">${esc(labels[0] ?? "")}</text>
    <text x="${W - P}" y="${H - 4}" font-size="11" fill="var(--mut)" text-anchor="end">${esc(labels[labels.length - 1] ?? "")}</text></svg>`;
}

      <div><div class="num">${D.stage === null ? "?" : st}<span class="mut" style="font-size:16px"> / 10</span></div>
        <span class="rank">${ic("trophy")}${esc(D.rank)}</span>
        <p class="mut" style="margin-top:6px">Растет только экзаменом ступени и не падает.</p></div></div>
    <p class="mut" style="text-align:center;margin-top:14px">Данные на ${esc(D.at)}${D.cut ? ", старые точки графиков не влезли" : ""}</p>`;
  requestAnimationFrame(() => setTimeout(() => $$(".fgc").forEach((c) => c.style.strokeDashoffset = c.dataset.off), 60));
  $$("[data-act]", $("#home")).forEach((b) => b.onclick = () => {
    const a = b.dataset.act;
    if (a === "review") send({ kind: "review" }, "Повтор");
    else tab(a);
  });
  wireRows($("#home"));
}
const wireGo = (root) => $$("[data-go]", root).forEach((b) => b.onclick = () => tab(b.dataset.go));

// сцена дня: самая давно не пройденная из рабочих
function suggest() {
  if (!CAT) return null;
  const pr = (D && D.pr) || {};
  const work = CAT.scenarios.filter((s) => s.cat === "work");
  return work.slice().sort((a, b) => ((pr[a.id] || [0])[0] - (pr[b.id] || [0])[0]))[new Date().getDate() % 2] || null;
}

// ───────────── учить
const KEY = () => "ans-" + (D && D.tasks ? D.tasks.date : "");
function saveLocal() { try { localStorage.setItem(KEY(), JSON.stringify(ANS)); } catch (e) { /* только удобство */ } }
function loadLocal() { try { return JSON.parse(localStorage.getItem(KEY()) || "{}"); } catch (e) { return {}; } }
const norm = (s) => String(s).trim().toLowerCase().replace(/[.!?]+$/, "").replace(/\s+/g, " ");
const isRight = (ans, v) => [].concat(ans).some((a) => norm(a) === norm(v));
const has = (v) => v !== undefined && v !== "" && !(Array.isArray(v) && !v.length);

function renderLearn() {
  const due = D ? D.due : null, t = D && D.tasks;
  ANS = t ? loadLocal() : {};
  $("#learn").innerHTML = `<h1>Учить</h1><p class="lead">Карточки из трекера и задания от репетитора</p>
    <div class="card c-violet" style="background:var(--violet-bg);margin-top:18px">
      <div class="cards-hero"><div class="tile" style="padding:0;min-height:0;background:none;box-shadow:none"><div class="sq" style="margin:0">${ic("layers")}</div></div>
        <div style="flex:1"><div class="num">${due ?? "?"}</div><p class="mut">${due === null ? "трекер не читается" : "карточек к повтору сегодня"}</p></div></div>
      ${due ? `<button class="btn press" style="margin-top:14px;background:var(--violet)" id="go-review">${ic("repeat")}Повторить в чате</button>` : ""}</div>
    <h2>Задания</h2>
    ${!t ? `<div class="card"><p>Заданий на сегодня нет.</p><p class="mut" style="margin-top:4px">Их кладет репетитор после урока.</p></div>` :
      (D.sent ? `<div class="card"><p class="mut">Ответы сегодня уже отправлены. Можно отправить еще раз, репетитор увидит обе версии.</p></div>` : "") +
      `<div class="card"><div class="head"><h3>Сделано</h3><span class="mut" id="t-cnt"></span></div><div class="bar"><i id="t-bar" style="width:0"></i></div></div>` +
      t.items.map((it, k) => `<div class="card task" id="it-${esc(it.id)}"><p class="q">${k + 1}. ${esc(it.prompt)}</p>${body(it)}<div class="res" id="r-${esc(it.id)}"></div></div>`).join("") +
      `<button class="btn press" id="send-tasks">${ic("check")}Отправить ответы</button>`}`;
  const r = $("#go-review"); if (r) r.onclick = () => send({ kind: "review" }, "Повтор");
  if (t) { t.items.forEach(wire); $("#send-tasks").onclick = sendAnswers; count(); }
}
function count() {
  const t = D.tasks, n = t.items.filter((it) => has(ANS[it.id])).length;
  $("#t-cnt").textContent = `${n} из ${t.items.length}`; $("#t-bar").style.width = `${100 * n / t.items.length}%`;
}

function body(it) {
  const v = ANS[it.id] ?? "";
  if (it.type === "choice") return `<div class="opts">${it.options.map((o) => `<button class="chip press" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  if (it.type === "gap") return `<input value="${esc(v)}" placeholder="слово${it.hint ? ", подсказка: " + esc(it.hint) : ""}"><div class="opts" style="margin-top:10px"><button class="chip press" data-check>Проверить</button></div>`;
  if (it.type === "fix") return `<textarea placeholder="исправленная фраза целиком">${esc(v)}</textarea>`;
  if (it.type === "timer") return `<div class="timer" data-t>${fmt(it.rounds[0])}</div><div class="opts">${it.rounds.map((s, i) => `<button class="chip press" data-r="${i}">Раунд ${i + 1}: ${fmt(s)}</button>`).join("")}<button class="chip press" data-stop>Стоп</button></div><p class="mut" style="margin-top:8px">Говори голосовым в чат бота, таймер держит время.</p>`;
  return `<p class="mut">Неизвестный тип задания: ${esc(it.type)}</p>`;
}

const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
let TIMER = null;

function wire(it) {
  const box = $(`#it-${CSS.escape(it.id)}`), res = $(`#r-${CSS.escape(it.id)}`);
  const save = (v) => { ANS[it.id] = v; saveLocal(); count(); };
  const verdict = (v) => {
    if (it.answer === undefined) { res.textContent = "Сохранено, проверит репетитор."; return; }
    const ok = isRight(it.answer, v); haptic(ok ? "light" : "rigid");
    res.innerHTML = ok ? `<span class="up">Верно!</span>` : `<span class="down">Верно: ${esc([].concat(it.answer)[0])}</span>`;
  };
  if (it.type === "choice") {
    $$("[data-o]", box).forEach((b) => {
      if (ANS[it.id] === b.dataset.o) { b.classList.add("on"); verdict(b.dataset.o); }
      b.onclick = () => { $$("[data-o]", box).forEach((x) => x.classList.remove("on")); b.classList.add("on"); save(b.dataset.o); verdict(b.dataset.o); };
    });
  } else if (it.type === "gap") {
    const inp = $("input", box);
    inp.oninput = () => { save(inp.value); res.textContent = ""; };
    $("[data-check]", box).onclick = () => {
      if (!inp.value.trim()) { res.innerHTML = `<span class="down">Сначала впиши слово.</span>`; return; }
      save(inp.value); verdict(inp.value);
    };
  } else if (it.type === "fix") {
    const ta = $("textarea", box);
    ta.oninput = () => { save(ta.value); res.textContent = "Сохранено, проверит репетитор."; };
  } else if (it.type === "timer") {
    const out = $("[data-t]", box), done = new Set(ANS[it.id] || []);
    if (done.size) res.textContent = `Пройдено раундов: ${[...done].map((i) => i + 1).join(", ")}`;
    $$("[data-r]", box).forEach((b) => b.onclick = () => {
      clearInterval(TIMER);
      const i = +b.dataset.r; let left = it.rounds[i];
      out.textContent = fmt(left); res.textContent = `Идет раунд ${i + 1}. Говори!`;
      TIMER = setInterval(() => {
        left -= 1; out.textContent = fmt(Math.max(left, 0));
        if (left <= 0) {
          clearInterval(TIMER); done.add(i); save([...done].sort());
          res.textContent = `Раунд ${i + 1} закончен. Пройдено: ${[...done].map((x) => x + 1).join(", ")}`;
          try { IN_TG && TG.HapticFeedback.notificationOccurred("success"); } catch (e) {}
        }
      }, 1000);
    });
    $("[data-stop]", box).onclick = () => { clearInterval(TIMER); res.textContent = "Остановлено, раунд не засчитан."; };
  }
}

function sendAnswers() {
  const filled = D.tasks.items.filter((it) => has(ANS[it.id])).length;
  if (send({ kind: "tasks", date: D.tasks.date, answers: ANS }, "Отправка ответов")) {
    const b = $("#send-tasks"); b.disabled = true; b.textContent = `Отправляю ${filled} из ${D.tasks.items.length}...`;
    setTimeout(() => { b.disabled = false; b.innerHTML = ic("check") + "Отправить ответы"; }, 4000);
  }
}

// ───────────── практика
const byId = (id) => CAT && CAT.scenarios.find((s) => s.id === id);
const catColor = (s) => s.color || ((CAT.cats.find((c) => c.id === s.cat) || {}).color) || "indigo";
function rowHtml(s) {
  const p = D && D.pr && D.pr[s.id];
  const badge = p ? `<span class="badge ok">${p[2] ? `${p[1]}/${p[2]}` : "✓"} · ${p[0]}×</span>` : "";
  return `<button class="row press c-${catColor(s)}" data-sc="${esc(s.id)}"><div class="dot">${ic(s.icon)}</div>
    <div class="tx"><h3>${esc(s.title)}</h3><p>${esc(s.sub)}</p></div>${badge}</button>`;
}
function wireRows(root) { $$("[data-sc]", root).forEach((b) => b.onclick = () => { haptic(); openScenario(b.dataset.sc); }); }

function renderPractice() {
  if (!CAT) { $("#practice").innerHTML = `<h1>Практика</h1><div class="card err"><b>Сценарии не загрузились.</b><br>Проверь интернет и открой мини-апп заново.</div>`; return; }
  const quick = CAT.quick.map(byId).filter(Boolean);
  $("#practice").innerHTML = `
    <div class="head"><h1>Практика</h1>${D && D.prt ? `<span class="pill">${ic("sparkles")}${D.prt} сегодня</span>` : ""}</div>
    <p class="lead">Сцены по сценариям: собеседник пишет в чат, ты отвечаешь голосом</p>
    <div class="tiles">${quick.map((s) => `<button class="tile press c-${s.tile || catColor(s)}" data-sc="${esc(s.id)}"><div class="sq">${ic(s.icon)}</div><h3>${esc(s.title)}</h3><p>${esc(s.sub)}</p></button>`).join("")}</div>
    ${CAT.cats.map((c) => `<h2>${esc(c.title)}</h2>${CAT.scenarios.filter((s) => s.cat === c.id).map(rowHtml).join("")}`).join("")}`;
  wireRows($("#practice"));
}

function openSheet(html) {
  $("#sheet-body").innerHTML = html;
  $("#veil").classList.add("open"); $("#sheet").classList.add("open");
  $("#sheet").scrollTop = 0;
  $$("[data-close]", $("#sheet")).forEach((b) => b.onclick = closeSheet);
  if (IN_TG) { try { TG.BackButton.show(); } catch (e) {} }
}
function closeSheet() {
  $("#veil").classList.remove("open"); $("#sheet").classList.remove("open");
  if (IN_TG) { try { TG.BackButton.hide(); } catch (e) {} }
}
$("#veil").onclick = closeSheet;
if (IN_TG) { try { TG.BackButton.onClick(closeSheet); } catch (e) {} }

function lvlGet(id) { try { return localStorage.getItem("lvl-" + id) || "B1"; } catch (e) { return "B1"; } }
function lvlSet(id, v) { try { localStorage.setItem("lvl-" + id, v); } catch (e) {} }

function openScenario(id) {
  const s = byId(id);
  if (!s) { toast("Такого сценария нет. Обнови мини-апп: /app в чате."); return; }
  if (s.kind === "writing") return openWriting(s);
  let lvl = lvlGet(id);
  const goals = s.kind === "words" ? ["Бот возьмет 5 слов из твоего трекера", "Собери из них короткую историю голосом", "Итог покажет, какие слова прозвучали"] : s.goals.map((g) => g.t);
  const hard = s.hard ? s.hard.length : 0;
  const levels = Object.entries(CAT.levels).filter(([k]) => k !== "B2" || hard || s.kind !== "scenario");
  openSheet(`
    <div class="head"><h1>${esc(s.title)}</h1><button class="x" data-close aria-label="Закрыть">${ic("x")}</button></div>
    <p class="lead" style="margin-top:8px">${esc(s.sub)}.${s.who ? ` Собеседник: ${esc(s.who)}.` : ""}</p>
    <div class="cap">Твоя цель: выполнить все пункты</div>
    ${goals.map((g) => `<div class="goal">${ic("check")}<span>${esc(g)}</span></div>`).join("")}
    <div class="cap">Сложность</div>
    <div class="lvl">${levels.map(([k]) => `<button class="chip press${k === lvl ? " on" : ""}" data-l="${k}">${k}</button>`).join("")}</div>
    <p class="mut" id="lvl-d" style="margin-top:8px"></p>
    <p class="note"><span id="n-turns"></span>. Отвечай в чате голосовым или текстом. В конце бот покажет цели по ключевым словам, число слов и темп. Смысл и грамматику разберет репетитор на уроке.</p>
    <button class="btn press" id="go">${ic("play")}Начать</button>`);
  const desc = () => {
    $("#lvl-d").textContent = CAT.levels[lvl] || "";
    $("#n-turns").textContent = s.turns ? `${s.turns.length + (lvl === "B2" ? hard : 0)} реплик` : s.kind === "pool" ? `${s.pick} вопроса` : "Две реплики";
  };
  desc();
  $$("[data-l]", $("#sheet")).forEach((b) => b.onclick = () => {
    haptic(); lvl = b.dataset.l; lvlSet(id, lvl);
    $$("[data-l]", $("#sheet")).forEach((x) => x.classList.toggle("on", x === b)); desc();
  });
  $("#go").onclick = () => send({ kind: "practice", id, level: lvl }, "Запуск сцены");
}

function openWriting(s) {
  const prompts = CAT.writing || [];
  let k = 0;
  const draft = () => { try { return localStorage.getItem("w-draft") || ""; } catch (e) { return ""; } };
  openSheet(`
    <div class="head"><h1>${esc(s.title)}</h1><button class="x" data-close aria-label="Закрыть">${ic("x")}</button></div>
    <p class="lead" style="margin-top:8px">Напиши по-английски, репетитор разберет ошибки на уроке.</p>
    <div class="cap">Тема</div>
    <div class="opts" id="wp">${prompts.map((p, i) => `<button class="chip press${i ? "" : " on"}" data-p="${i}">${i + 1}</button>`).join("")}</div>
    <p style="margin:12px 0" id="wp-t">${esc(prompts[0] || "")}</p>
    <textarea id="wt" style="min-height:150px" placeholder="Your text in English...">${esc(draft())}</textarea>
    <p class="mut" id="wc" style="margin:6px 0 16px"></p>
    <button class="btn press" id="wsend">${ic("pen-line")}Отправить репетитору</button>`);
  const wt = $("#wt"), wc = () => { const n = (wt.value.match(/[A-Za-z']+/g) || []).length; $("#wc").textContent = `${n} слов`; };
  wc();
  wt.oninput = () => { wc(); try { localStorage.setItem("w-draft", wt.value); } catch (e) {} };
  $$("[data-p]", $("#sheet")).forEach((b) => b.onclick = () => {
    k = +b.dataset.p; $$("[data-p]", $("#sheet")).forEach((x) => x.classList.toggle("on", x === b)); $("#wp-t").textContent = prompts[k];
  });
  $("#wsend").onclick = () => {
    if (!wt.value.trim()) { toast("Сначала напиши текст."); return; }
    if (send({ kind: "writing", prompt: prompts[k], text: wt.value.trim() }, "Отправка текста")) { try { localStorage.removeItem("w-draft"); } catch (e) {} }
  };
}

// ───────────── прогресс
function renderStats() {
  if (!D || !D.form) { $("#stats").innerHTML = `<h1>Прогресс</h1><div class="card"><p>Данных нет. Отправь боту /app и открой мини-апп кнопкой внизу чата.</p></div>`; return; }
  const f = D.form, rec = D.rec || [], ps = D.ps || [];
  const got = D.ach.filter((a) => a[1]).length;
  const pr = Object.entries(D.pr || {}).map(([id, v]) => [byId(id), v]).filter(([s]) => s).sort((a, b) => b[1][0] - a[1][0]);
  $("#stats").innerHTML = `<h1>Прогресс</h1><p class="lead">Форма, речь и достижения</p>
    <div class="kpis" style="margin-top:18px">
      <div class="kpi c-indigo">${ic("chart-line")}<b>${f.now}</b><span class="mut">форма</span></div>
      <div class="kpi c-orange">${ic("flame")}<b>${D.streak[0]}</b><span class="mut">дн. подряд, рекорд ${D.streak[1]}</span></div>
      <div class="kpi c-violet">${ic("trophy")}<b>${got}</b><span class="mut">из ${D.ach.length} достижений</span></div>
      <div class="kpi c-teal">${ic("mic")}<b>${Object.values(D.pr || {}).reduce((a, v) => a + v[0], 0)}</b><span class="mut">сцен пройдено</span></div></div>
    <div class="card"><h3>Форма за 30 дней</h3><p class="mut">Пропуск дня снимает 10%, воскресенье не снимает</p>${chart(f.s, [f.start, "сегодня"], { min: 0, area: true })}</div>
    <div class="card"><h3>Темп речи</h3><p class="mut">слов в минуту</p>${chart(rec.map((r) => r[1]), rec.map((r) => r[0]), { area: true })}</div>
    <div class="card"><h3>Паузы длиннее 2 с</h3><p class="mut">в минуту, чем ниже, тем лучше</p>${chart(rec.map((r) => r[2]), rec.map((r) => r[0]), { min: 0 })}</div>
    <div class="card"><h3>Past simple верно</h3><p class="mut">в рассказах, %</p>${chart(ps.map((r) => r[1]), ps.map((r) => r[0]), { suffix: "%", min: 0, max: 100 })}</div>
    ${pr.length ? `<h2>Сцены</h2>${pr.map(([s, v]) => `<div class="row c-${catColor(s)}"><div class="dot">${ic(s.icon)}</div><div class="tx"><h3>${esc(s.title)}</h3><p>${v[0]} раз${v[2] ? `, лучшее ${v[1]} из ${v[2]} целей` : ""}</p></div></div>`).join("")}` : ""}
    <h2>Достижения</h2>
    <div class="card"><div class="ach">${D.ach.map(([t, g, p]) => `<div class="${g ? "got" : "no"}">${ic(g ? "trophy" : "lock")}<div>${esc(t)}<span>${esc(p)}</span></div></div>`).join("")}</div></div>`;
}

// ───────────── старт
(async () => {
  const z = new URLSearchParams((window.__HASH || "").slice(1)).get("z");
  const catP = fetch("scenarios.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((c) => { CAT = c; }).catch((e) => showErr([`Сценарии не загрузились: ${e.message || e}`]));
  if (!z) showErr(["В ссылке нет данных. Открой мини-апп кнопкой «📊 Прогресс» в чате бота (/app обновит кнопку)."]);
  else {
    try { D = await decode(z); showErr(D.err || []); }
    catch (e) { showErr([`Данные в ссылке повреждены (${e.message || e}). Отправь боту /app и открой новую кнопку.`]); }
  }
  await catP;
  renderLearn(); renderPractice(); renderStats(); renderHome();
  tab(D && D.tasks && !D.sent && TAB === "home" ? "home" : TAB);
})().catch((e) => showErr([`Сбой страницы: ${e.message || e}`]));
window.addEventListener("error", (e) => showErr([`Сбой страницы: ${e.message}`]));
</script>
</body>
</html>
