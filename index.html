<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English с Khan</title>
<!-- Данные приходят во фрагменте ссылки (#z=...), фрагмент не уходит на сервер.
     Читаем его ДО скрипта Telegram: тот дописывает в hash свои параметры. -->
<script>window.__HASH = location.hash;</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Цветовая политика (CR-17, research/cvetovaya-politika.md): тепло в фоне и слоях, холодный синий только на действиях,
   один цвет на смысл. Фон Telegram не используется. Светлая «Лен» и темная «Какао»; «Графит» запасной одним атрибутом data-pal="grafit".
   --bg фон, --surf слой, --top цвет шапки Telegram, --mut текст 2, --mut3 текст 3 (метки, неактивное),
   --ink действие, --speech речь, --prec точность, --vocab словарь, --ok верно, --bad правка, --coral серия и праздник. */
:root, :root[data-theme="light"] {   /* светлая «Лен» */
  --bg: #f7f3ec; --surf: #fffdf8; --top: #f7f3ec; --bg2: var(--surf);
  --fg: #2a2521; --mut: #6f665c; --mut3: #8b8175;
  --ink: #34498f; --on-ink: #ffffff;
  --speech: #6b47b8; --prec: #16684a; --vocab: #8a5a0c; --coral: #a63f17;
  --ok: #16684a; --bad: #ab2f45;
  color-scheme: light;
}
:root[data-theme="dark"] {   /* темная «Какао» */
  --bg: #2e2520; --surf: #3b302a; --top: #2e2520; --bg2: var(--surf);
  --fg: #f6ece3; --mut: #bdab9c; --mut3: #94826f;
  --ink: #a3b3ff; --on-ink: #1b1d2e;
  --speech: #c8aaff; --prec: #62c896; --vocab: #f3cd78; --coral: #ffa070;
  --ok: #62c896; --bad: #f27d8e;
  color-scheme: dark;
}
:root[data-theme="dark"][data-pal="grafit"] {   /* запасной «Графит» */
  --bg: #2b2824; --surf: #37332e; --top: #2b2824;
  --fg: #f3ede4; --mut: #b5ab9e;
}
:root[data-theme="dark"] ::placeholder { color: var(--mut); }
:root {
  --card: var(--bg2); --line: color-mix(in srgb, var(--fg) 10%, var(--bg)); --track: color-mix(in srgb, var(--fg) 9%, var(--bg));
  --acc: var(--ink);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--page, var(--bg)); color: var(--fg); font: 500 15px/1.45 Onest, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
h1 { font-size: 25px; font-weight: 800; letter-spacing: -.01em; margin: 2px 0 0; line-height: 1.2; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); margin: 26px 0 4px; }
h3 { font-size: 16px; font-weight: 600; margin: 0; }
p { margin: 0; }
.mut { color: var(--mut); font-size: 14px; font-weight: 500; }
.sm { font-size: 12.5px; }
.lead { color: var(--mut); font-size: 15px; font-weight: 500; }
.hidden { display: none !important; }
.ic { width: 24px; height: 24px; flex: none; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:disabled { opacity: .55; cursor: default; }

/* движение: короткое, при reduced-motion выключено целиком */
.in > * { animation: up .25s cubic-bezier(.2, .8, .2, 1) both; }
.in > *:nth-child(2) { animation-delay: .03s; } .in > *:nth-child(3) { animation-delay: .06s; }
.in > *:nth-child(n+4) { animation-delay: .09s; }
@keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 50% { transform: scaleY(1.3); } }
.press { transition: transform .1s ease; }
.press:active { transform: scale(.985); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ───── главная */
.hd { display: flex; align-items: flex-start; gap: 12px; }
.hd > div { flex: 1; min-width: 0; }
.streak { display: inline-flex; align-items: center; gap: 4px; color: var(--coral); font-weight: 700; font-size: 16px; margin-top: 4px; }
.streak .ic { width: 22px; height: 22px; }

.lvl { margin-top: 20px; }
.lvl-hd { display: flex; align-items: center; gap: 10px; }
.lvl-hd b { font-size: 34px; font-weight: 800; color: var(--ink); line-height: 1; letter-spacing: -.02em; white-space: nowrap; }
.lvl-hd b.no { font-size: 22px; }
.lvl-hd span { font-size: 12.5px; color: var(--mut); line-height: 1.4; }
.track { position: relative; height: 16px; display: flex; gap: 3px; margin: 14px 0 6px; }
.track > i { position: relative; display: block; height: 100%; background: var(--track); border-radius: 4px; overflow: hidden; }
.track > i > u { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.track > i.cur { background: color-mix(in srgb, var(--ink) 16%, var(--bg)); }   /* текущая полоса видна и на ее нижней границе */
.track > i.cur > u { background: linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--ink) 55%, var(--bg))); }
/* штрих в два цвета: чернила видны на пустой части, светлые полосы на залитой, зона ± читается по обе стороны отметки */
.zone { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--ink) 38%, transparent) 0 3px, color-mix(in srgb, var(--bg) 55%, transparent) 3px 6px); }
.stale { margin-top: 20px; padding: 12px 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); font-size: 14px; }
.stale b { font-weight: 700; }
.mark { position: absolute; top: -6px; width: 4px; height: 28px; margin-left: -2px; border-radius: 2px; background: var(--fg); box-shadow: 0 0 0 2px var(--bg); }
.mark.ghost { opacity: .25; box-shadow: none; }
.mark.pulse { animation: pulse .6s ease-out 2; }
.lab { display: flex; gap: 3px; font-size: 11.5px; color: var(--mut); }
.need { margin: 10px 0 0; padding-left: 18px; font-size: 13px; color: var(--mut); }
.need li { margin: 2px 0; }
.subs { display: flex; gap: 14px; margin-top: 14px; align-items: flex-end; }
.subs > div { flex: 1; min-width: 0; font-size: 11.5px; color: var(--mut); }
.subs i { display: block; height: 5px; border-radius: 3px; background: var(--track); margin-top: 4px; overflow: hidden; }
.subs i u { display: block; height: 100%; background: var(--c); }
.subs .fz u { opacity: .45; }
.subs > .st { flex: none; text-align: right; }
.subs .st b { display: block; font-size: 15px; font-weight: 700; color: var(--fg); line-height: 1.1; }

.now { margin-top: 22px; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--ink); color: var(--on-ink); border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 16px; line-height: 1.3; }
.now > span { flex: 1; min-width: 0; }
.now small { display: block; font-weight: 500; font-size: 12.5px; opacity: .78; margin-top: 2px; }
.now.quiet { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 40%, transparent); }
.now.quiet small { color: var(--mut); opacity: 1; }

.todo { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.todo:last-child { border-bottom: 0; }
.todo .chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c) 50%, var(--bg)); flex: none; display: grid; place-items: center; color: transparent; }
.todo.done .chk { background: var(--c); border-color: var(--c); color: var(--bg); }
.todo .chk .ic { width: 13px; height: 13px; }
.todo .tx { flex: 1; min-width: 0; }
.todo .tx b { display: block; font-weight: 600; font-size: 15px; }
.todo .tx span { font-size: 12.5px; color: var(--mut); }
.todo .go { flex: none; color: var(--ink); font-weight: 700; font-size: 14px; padding: 8px 0 8px 10px; }

.goal-l { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 14px; margin-top: 6px; }
.goal-l b { font-weight: 700; font-size: 15px; }
.goal-l .sp { color: var(--speech); font-weight: 600; }
.goal-l .sp.no { color: var(--mut); font-weight: 500; }
.gbar { height: 5px; border-radius: 3px; background: var(--track); margin: 8px 0 14px; overflow: hidden; }
.gbar u { display: block; height: 100%; background: var(--ink); }
.week { display: flex; justify-content: space-between; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: var(--mut); width: 36px; }
.day i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; position: relative; background: conic-gradient(var(--ink) calc(var(--p) * 1%), var(--track) 0); }
.day i::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--bg); }
.day.met i { background: var(--ink); color: var(--on-ink); } .day.met i::after { display: none; }
.day i .ic { width: 14px; height: 14px; position: relative; z-index: 1; }
.day.rest i { background: var(--track); color: var(--mut); } .day.rest i::after { display: none; }
.day.future i { background: var(--track); opacity: .5; } .day.future i::after { display: none; }
.day.today span { color: var(--fg); font-weight: 700; }
.foot { text-align: center; margin-top: 22px; font-size: 12px; color: var(--mut); }

/* ───── «Учить», «Практика», «Прогресс» (F5): строки и пробел вместо плиток, иконка цветом вида работы без подложки */
.card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }   /* только ошибки данных */
.err { box-shadow: inset 0 0 0 1.5px var(--bad); }
.err b { color: var(--bad); }
.empty { margin-top: 8px; font-size: 14px; color: var(--mut); }
.item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list > .item:last-child { border-bottom: 0; }
.item > .ic { color: var(--c, var(--ink)); }
.item .tx { flex: 1; min-width: 0; }
.item .tx b { display: block; font-weight: 600; font-size: 15px; line-height: 1.3; }
.item .tx span { display: block; font-size: 12.5px; color: var(--mut); line-height: 1.35; margin-top: 1px; }
.item .go { flex: none; color: var(--ink); font-weight: 700; font-size: 14px; padding: 8px 0 8px 10px; }
.item .pass { flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--c); white-space: nowrap; }
.item .pass .ic { width: 15px; height: 15px; }
.list.tight .item { padding: 7px 0; gap: 12px; border-bottom: 0; }
.list.tight .item > .ic { width: 18px; height: 18px; }
.list.tight .item .tx b { font-size: 14px; font-weight: 500; }
.list.tight .item.no { color: var(--mut); }
.list.tight .item small { flex: none; font-size: 12.5px; color: var(--mut); }
/* быстрые режимы одной строкой: три колонки текста между линиями, без фона */
.quick { display: flex; margin-top: 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.quick button { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 12px 10px; }
.quick button + button { border-left: 1px solid var(--line); }
.quick button:first-child { padding-left: 0; }
.quick .ic { color: var(--c); }
.quick b { font-weight: 600; font-size: 14px; line-height: 1.25; overflow-wrap: break-word; hyphens: auto; }   /* длинное слово переносится, а не налезает на соседа */
/* сцена дня: метка цветом речи, действие чернилами; остальные строки тихие */
.item.pick .tx em { display: block; font-style: normal; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.item.pick .tx b { font-weight: 700; font-size: 16px; }
.chart { width: 100%; height: 130px; display: block; margin-top: 10px; overflow: visible; }
.blk { padding: 16px 0; border-bottom: 1px solid var(--line); }
.blk h3 b { font-weight: 800; }
.lg-line { margin-top: 24px; font-size: 12.5px; color: var(--mut); }
.lg-line span { white-space: nowrap; }
.lg-line b { color: var(--fg); font-weight: 700; }
.task { padding: 16px 0; border-bottom: 1px solid var(--line); }
.task p.q { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
.task p.q i { font-style: normal; color: var(--prec); font-weight: 700; margin-right: 6px; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border-radius: 12px; padding: 9px 16px; font-weight: 600; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line); }
.chip.on { color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
input, textarea { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); outline: none; }
input:focus, textarea:focus { border-color: var(--ink); }
textarea { min-height: 76px; resize: vertical; }
.res { margin-top: 8px; font-size: 14px; min-height: 1em; font-weight: 600; }
.up { color: var(--ok); } .down { color: var(--bad); }
.timer { font-size: 56px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; margin: 4px 0 10px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 16px; background: var(--ink); color: var(--on-ink); }
.btn .ic { width: 20px; height: 20px; }

/* ───── карточки повтора в странице (F8): лист тетради — линия цветом вида работы, вопрос крупно, ответ чернилами */
.cs-top { display: flex; align-items: center; gap: 12px; }
.cs-top h1 { flex: 1; }
.cs-n { font-size: 14px; font-weight: 700; color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cs-on nav { display: none; }                 /* сессия карточек без меню, выход крестиком */
.cs-on main { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
.cs-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surf); border-top: 1px solid var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); }
.cs-bar > div { max-width: 560px; margin: 0 auto; }
.cs-bar .btn { min-height: 56px; }
.cs-bar .grades { margin-top: 0; }
.cs-bar .link { display: block; width: 100%; min-height: 48px; margin: 0; text-align: center; }
.next { margin-top: 4px; font-size: 15px; }
.next b { font-weight: 700; color: var(--ink); }
.xb { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--mut); flex: none; }
.fc { margin-top: 18px; padding: 0 0 4px; }
.fc em { display: block; font-style: normal; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.fc .q { font-size: 22px; font-weight: 700; line-height: 1.3; margin-top: 10px; overflow-wrap: anywhere; }
.fc .a { margin-top: 18px; padding-top: 14px; border-top: 1px dashed color-mix(in srgb, var(--fg) 22%, var(--bg)); font-size: 19px; font-weight: 600; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
.fc .mine { margin-top: 8px; font-size: 14px; color: var(--mut); overflow-wrap: anywhere; }
.fc input { margin-top: 18px; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
.grades small { display: block; margin-top: 3px; font-size: 12px; font-weight: 500; opacity: .8; }
.grades button { min-height: 64px; padding: 12px 4px; border-radius: 14px; font-weight: 700; font-size: 14px; line-height: 1.2; color: var(--c); background: color-mix(in srgb, var(--c) 9%, var(--bg)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 55%, transparent); }
.tally { display: flex; margin-top: 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tally > div { flex: 1; padding: 12px 0; font-size: 12.5px; color: var(--mut); }
.tally > div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.tally b { display: block; font-size: 26px; font-weight: 800; color: var(--c); line-height: 1.1; font-variant-numeric: tabular-nums; }
.sent { margin-top: 18px; padding: 12px 0; border-top: 2px solid var(--ok); font-size: 14px; }
.sent b { font-weight: 700; color: var(--ok); }
.link { display: inline-block; margin-top: 10px; color: var(--ink); font-weight: 600; font-size: 14px; padding: 6px 0; }

/* шторка шкалы (F4) */
.lvl[role=button] { cursor: pointer; border-radius: 12px; outline-offset: 4px; }
.lvl[role=button]:focus-visible { outline: 2px solid var(--ink); }
.lvl .more { display: block; margin-top: 8px; font-size: 12.5px; color: var(--ink); font-weight: 600; }
.sb { padding: 14px 0; border-bottom: 1px solid var(--line); }
.sb-hd { display: flex; align-items: baseline; gap: 10px; }
.sb-hd h3 { flex: 1; color: var(--c); display: flex; align-items: center; gap: 8px; }
.sb-hd h3 .ic { width: 22px; height: 22px; }
.sb-hd b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sb-hd b small { font-size: 12.5px; font-weight: 500; color: var(--mut); }
.sb i.bar { display: block; height: 6px; border-radius: 3px; background: var(--track); margin: 8px 0 6px; overflow: hidden; }
.sb i.bar u { display: block; height: 100%; background: var(--c); }
.sb.fz i.bar u { opacity: .45; }
.sb .meta { font-size: 12.5px; color: var(--mut); }
.sb .tag { font-weight: 700; color: var(--c); }
.sb.fz .tag, .sb.no .tag { color: var(--mut); }
.sb .hint { margin-top: 6px; font-size: 14px; }
.sb .hint b { font-weight: 700; }
.ladder { display: flex; gap: 3px; margin-top: 10px; }
.ladder > div { flex: 1; min-width: 0; text-align: center; font-size: 11px; color: var(--mut); }
.ladder .cells { display: flex; gap: 3px; margin-top: 4px; }
.ladder .cells i { flex: 1; height: 26px; border-radius: 5px; background: var(--track); display: grid; place-items: center; font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--mut); }
.ladder .cells i.done { background: color-mix(in srgb, var(--c) 30%, var(--bg)); color: var(--fg); }
.ladder .cells i.cur { background: var(--c); color: var(--on-ink); }
.chkbox { margin-top: 16px; padding: 12px 0; border-top: 2px solid var(--ink); font-size: 14px; }
.chkbox b { font-weight: 700; }
.sb .ladder + .meta { margin-top: 10px; }
.gse { margin-top: 14px; font-size: 12.5px; color: var(--mut); }

/* нижнее меню: активная вкладка чернилами, без плашки */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surf); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
nav div { max-width: 560px; margin: 0 auto; display: flex; gap: 6px; }
nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 500; color: var(--mut); padding: 4px 0; }
nav button .ic { width: 24px; height: 24px; }
nav button.on { color: var(--ink); font-weight: 700; }

/* шторка */
.thm { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; color: var(--mut); font-size: 14px; }
.thm > div { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.thm button { padding: 8px 12px; font-size: 13.5px; font-weight: 600; color: var(--mut); }
.thm button.on { background: var(--ink); color: var(--on-ink); }
.veil { position: fixed; inset: 0; z-index: 10; background: rgba(10, 14, 28, .45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.veil.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 88vh; overflow-y: auto; background: var(--surf); border-radius: 20px 20px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.sheet.open { transform: none; }
.sheet:focus { outline: none; }
.sheet > div { max-width: 560px; margin: 0 auto; }
.sheet .x { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--mut); flex: none; }
.sheet h1 { font-size: 22px; margin: 0; }
.sheet h1 .ic { display: inline-block; width: 26px; height: 26px; vertical-align: -5px; margin-right: 8px; color: var(--c, var(--ink)); }
.cap { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; color: var(--mut); text-transform: uppercase; margin: 20px 0 8px; }
.goal { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; font-size: 15px; }
.goal .ic { width: 20px; height: 20px; color: var(--ok); margin-top: 1px; }
.goal .gd { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--mut)); margin: 9px 6px 0; opacity: .7; }
.note { margin: 16px 0; font-size: 14px; color: var(--mut); }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 20; max-width: 528px; margin: 0 auto; background: var(--fg); color: var(--bg); padding: 13px 16px; border-radius: 14px; font-size: 14px; opacity: 0; transform: translateY(10px); transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
#confetti { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
</style>

function toast(msg, ms = 4200) {

}

// sendData закрывает мини-апп, бот отвечает в чате. Работает только из кнопки внизу чата.
function send(obj, what) {
  const payload = JSON.stringify(obj);
  const bytes = new Blob([payload]).size;
  if (bytes > LIMIT) { toast(`Слишком длинно: ${bytes} байт из ${LIMIT}. Сократи текст.`); return false; }
  if (!IN_TG) { toast(`Страница открыта не из Telegram. ${what} работает из кнопки «📊 Прогресс» внизу чата бота.`); return false; }
  try { haptic("medium"); TG.sendData(payload); }
  catch (e) { toast(`Не отправилось: ${e.message || e}. Открой мини-апп кнопкой «📊 Прогресс» внизу чата.`); return false; }
  setTimeout(() => toast("Telegram не закрыл окно, значит команда не ушла. Открой мини-апп кнопкой «📊 Прогресс» внизу чата, не под сообщением.", 7000), 4000);
  return true;
}

async function decode(z) {
  const b64 = z.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((z.length + 3) % 4);
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  if (!("DecompressionStream" in window)) throw new Error("этот Telegram слишком старый: нет DecompressionStream, обнови приложение");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

// ───────────── графики
// первая показанная точка «Регулярности»: ряд дневной и кончается днем данных, после урезания старых точек начало сдвигается
function formStart(f) {
  if (!D.day || !f.s || !f.s.length) return f.start;
  const d = new Date(D.day + "T12:00:00"); d.setDate(d.getDate() - (f.s.length - 1));
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function chart(values, labels, { suffix = "", max = null, min = null, area = false, c = "--ink" } = {}) {
  const pts = values.map((v, i) => [i, v]).filter(([, v]) => typeof v === "number");
  if (!pts.length) return `<p class="empty">Пока нет данных.</p>`;
  const W = 300, H = 120, P = 14;
  const lo = min ?? Math.min(...pts.map((p) => p[1])), hi = max ?? Math.max(...pts.map((p) => p[1]));
  const span = hi - lo || 1, n = Math.max(values.length - 1, 1);
  const xy = pts.map(([i, v]) => [P + (i / n) * (W - 2 * P), H - 22 - ((v - lo) / span) * (H - 22 - P)]);
  const line = xy.map((p) => p.map((x) => x.toFixed(1)).join(",")).join(" ");
  const last = xy[xy.length - 1], lv = pts[pts.length - 1][1];
  const fill = area && xy.length > 1 ? `<polygon fill="var(${c})" opacity=".12" points="${xy[0][0]},${H - 22} ${line} ${last[0]},${H - 22}"/>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${fill}
    <polyline fill="none" stroke="var(${c})" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${line}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--bg)" stroke="var(${c})" stroke-width="3" vector-effect="non-scaling-stroke"/>
    <text x="${last[0] > 60 ? last[0] - 10 : last[0] + 10}" y="${Math.max(last[1] - 10, 12)}" text-anchor="${last[0] > 60 ? "end" : "start"}" font-size="13" font-weight="900" fill="var(--fg)">${esc(lv)}${suffix}</text>
    <text x="${P}" y="${H - 4}" font-size="11" fill="var(--mut)">${esc(labels[0] ?? "")}</text>
    <text x="${W - P}" y="${H - 4}" font-size="11" fill="var(--mut)" text-anchor="end">${esc(labels[labels.length - 1] ?? "")}</text></svg>`;
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  try { IN_TG && TG.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  const cv = $("#confetti"), cx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.classList.remove("hidden"); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement), cols = ["--coral", "--ink", "--speech", "--prec", "--vocab"].map((n) => cs.getPropertyValue(n).trim());
  const ps = Array.from({ length: 70 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 4, r: Math.random() * 6, c: cols[Math.random() * cols.length | 0], w: 6 + Math.random() * 5 }));
  const t0 = performance.now();
  const frame = (t) => {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += .12; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -3, p.w, 6); cx.restore(); }
    if (t - t0 < 1800) requestAnimationFrame(frame); else cv.classList.add("hidden");
  };
  requestAnimationFrame(frame);
}

// ───────────── главная
// шкала A2 → B2 (SPEC v4 F3.1): сегменты полос, отметка L, штрихованная зона ±, подшкалы цветами видов работы
// полосы как в level.BANDS, шкала L 30-75 целиком
// F7: ссылка урезана (tasks.cut): текстов нет, есть n и items [{id,type}]
const tasksCut = (t) => !!(t && t.cut);
const toChat = () => send({ kind: "tasks_chat" }, "Задания в чат");
const tasksN = (t) => (t.cut && typeof t.n === "number" ? t.n : t.items.length);
const SEG = [["A2", 30, 45], ["B1", 45, 52], ["B1+", 52, 59], ["B2", 59, 66], ["сильный B2", 66, 75]];
const L_MIN = 30, L_MAX = 75;
const pos = (v) => Math.max(0, Math.min(100, (v - L_MIN) / (L_MAX - L_MIN) * 100));
const at = (v) => `left:clamp(2px, ${pos(v)}%, calc(100% - 2px))`;     // отметка на краях 30 и 75 не уходит за трек
const SUBS = [["f", "Беглость", "--speech"], ["a", "Точность", "--prec"], ["v", "Словарь", "--vocab"]];
// ступени: нет отметок [x] (v подшкалы пуст) = «не сданы», а не 0; 0 только когда ступень 0 сдана
const stageNone = () => { const t = D && D.level && D.level.sub && D.level.sub.t; return !!t && typeof t.v !== "number"; };
const stageNow = () => stageNone() ? null : D && typeof D.stage === "number" ? D.stage : null;
function levelHtml(lv) {
  const ok = lv && lv.st === "ok" && typeof lv.L === "number";
  const L = ok ? Math.max(L_MIN, Math.min(L_MAX, lv.L)) : null;
  const segs = SEG.map(([, lo, hi], i) => {
    const f = L === null ? 0 : Math.max(0, Math.min(1, (L - lo) / (hi - lo)));
    const cur = L !== null && L >= lo && (L < hi || i === SEG.length - 1);       // и на нижней границе полосы
    return `<i style="flex:${hi - lo}" class="${cur ? "cur" : ""}"><u style="width:${100 * f}%"></u></i>`;
  }).join("");
  let marks = "";
  if (ok) {
    const prev = +store.get("lvl-L", L), lo = Math.max(L_MIN, L - lv.pm), hi = Math.min(L_MAX, L + lv.pm);
    store.set("lvl-L", L);
    if (prev !== L) marks += `<span class="mark ghost" style="${at(prev)}"></span>`;
    marks += `<span class="zone" style="left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%"></span>
      <span class="mark${prev !== L ? " pulse" : ""}" style="${at(L)}"></span>`;
  }
  const chk = ok && lv.chk ? ` · контроль ${lv.chk.L} (${lv.chk.diff > 0 ? "+" : ""}${lv.chk.diff})` : "";
  const head = ok
    ? `<b>${esc(lv.b)}</b><span>${L} ± ${lv.pm} · ${lv.to ? `до B2 осталось ${lv.to}` : "B2 взят"}<br>замер ${esc(dm(lv.d))}${esc(chk)}</span>`
    : lv && lv.st === "error" ? `<b class="no">шкала не посчиталась</b><span>причина в ошибках данных сверху</span>`
    : lv && lv.st === "none" ? `<b class="no">не оценен</b><span>числа нет, пока мало замеров${lv.d ? `<br>последний замер ${esc(dm(lv.d))}` : ""}</span>`
    : `<b class="no">нет данных</b><span>бот не прислал шкалу: /app в чате</span>`;
  const need = lv && lv.st === "none" && lv.need && lv.need.length ? `<ul class="need">${lv.need.map((n) => `<li>нужно: ${esc(n)}</li>`).join("")}</ul>` : "";
  const sub = (lv && lv.sub) || {};
  const subs = SUBS.map(([k, t, c]) => {
    const s = sub[k] || {}, v = typeof s.v === "number" ? s.v : null;
    const tip = v === null ? "нет данных" : `${v} из 100${s.s === "frozen" ? ", заморожено с " + dm(s.d) : ""}`;
    return `<div class="${s.s === "frozen" ? "fz" : ""}" style="--c:var(${c})" title="${esc(tip)}">${t}<i><u style="width:${v ?? 0}%"></u></i></div>`;
  }).join("");
  const stg = stageNow();
  return `<div class="lvl" id="lvl-open" role="button" tabindex="0" aria-label="Подробности шкалы уровня"><div class="lvl-hd">${head}</div>
    <div class="track">${segs}${marks}</div>
    <div class="lab">${SEG.map(([n, lo, hi]) => `<span style="flex:${hi - lo}">${n}</span>`).join("")}</div>${need}
    <div class="subs">${subs}<div class="st">Ступени<b>${stg === null ? (stageNone() ? "не сданы" : "?") : stg + " из 10"}</b></div></div><span class="more">Подробности</span></div>`;
}

// шторка «Подробности шкалы» (SPEC v4 F4)
// ранги ступеней программы репетитора: Бронза 0-2 и Алмаз 8-10 по SPEC, Серебро 3-4 и Золото 5-7 как считал progress.rank до F5, в программе рангов нет.
// ponytail: на странице program-b2-strong.md данных рангов нет, поэтому зашито здесь; известный долг, источник правды там.
const RANKS = [["Бронза", 0, 2], ["Серебро", 3, 4], ["Золото", 5, 7], ["Алмаз", 8, 10]];
function subHtml(t, c, s, ladder) {
  s = s || {};
  const v = typeof s.v === "number" ? s.v : null, frz = s.s === "frozen" && !ladder;
  let tag, meta;
  if (v === null) { tag = "нет данных"; meta = ""; }
  else if (frz) { tag = `заморожено с ${dm(s.d)}`; meta = "давно не обновлялось, значение держится"; }
  else if (s.s === "fresh") { tag = "обновлено"; meta = s.d ? `замер ${dm(s.d)}` : ""; }
  else { tag = ladder ? "по последней отметке" : "замер"; meta = s.d ? ` ${dm(s.d)}` : ""; }
  const stg = ladder ? (stageNone() ? null : D && typeof D.stage === "number" ? D.stage : v !== null ? Math.round(v / 10) : null) : null;
  const num = ladder ? (stg === null ? `<b style="font-size:15px">не сданы</b>` : `<b>${stg}<small> из 10</small></b>`) : v === null ? `<b>—</b>` : ladder ? `<b>${stg}<small> из 10</small></b>` : `<b>${v}<small> из 100</small></b>`;
  const lad = !ladder ? "" : `<div class="ladder">${RANKS.map(([n, lo, hi]) => `<div style="flex:${hi - lo + 1}">${n}<div class="cells">${
    Array.from({ length: hi - lo + 1 }, (_, i) => lo + i).map((k) => `<i class="${stg === k ? "cur" : stg !== null && k < stg ? "done" : ""}">${k}</i>`).join("")}</div></div>`).join("")}</div>`;
  return `<div class="sb${frz ? " fz" : ""}${v === null ? " no" : ""}" style="--c:var(${c})">
    <div class="sb-hd"><h3>${ic(t[1])}${t[0]}</h3>${num}</div>
    ${ladder ? "" : `<i class="bar"><u style="width:${v ?? 0}%"></u></i>`}${lad}
    <p class="meta"><span class="tag">${esc(tag)}</span>${meta ? " · " + esc(meta.trim()) : ""}</p>
    ${s.h ? `<p class="hint"><b>Что поднимет:</b> ${esc(s.h)}</p>` : ""}${s.n ? `<p class="meta" style="margin-top:4px">${esc(s.n)}</p>` : ""}</div>`;
}
function openLevel() {
  const lv = D && D.level, ok = lv && lv.st === "ok" && typeof lv.L === "number", sub = (lv && lv.sub) || {};
  const head = ok ? `${esc(lv.b)}, ${lv.L} ± ${lv.pm}` : lv && lv.st === "none" ? "Не оценен" : "Нет данных";
  const need = lv && lv.st === "none" && lv.need && lv.need.length
    ? `<h2 class="cap">Что нужно для оценки</h2><ul class="need" style="font-size:14px">${lv.need.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : "";
  const chk = lv && lv.chk ? `<div class="chkbox"><b>Контрольный замер репетитора:</b> ${esc(lv.chk.L)}, ${esc(dm(lv.chk.date))}${
    typeof lv.chk.diff === "number" ? `<br><span class="mut">расхождение со шкалой ${lv.chk.diff > 0 ? "+" : ""}${lv.chk.diff}</span>` : ""}</div>` : "";
  const T = [["Беглость", "microphone-duotone"], ["Точность", "seal-check-duotone"], ["Словарь", "cards-duotone"]];
  openSheet(`<div class="head"><h1>${head}</h1><button class="x" data-close aria-label="Закрыть">${ic("x")}</button></div>
    <p class="lead" style="margin-top:4px">Из чего сложена шкала</p>${need}
    ${[["f", "--speech"], ["a", "--prec"], ["v", "--vocab"]].map(([k, c], i) => subHtml(T[i], c, sub[k], false)).join("")}
    ${subHtml(["Ступени", "list-checks-duotone"], "--ink", sub.t, true)}${chk}
    <p class="gse">Шкала L считается по образцу GSE, не официальный балл.</p>`);
}

// кнопка «Сейчас» (SPEC v4 F3, CR-12): карточки первыми всегда → норма взята: тихая → голосовое, если речи нет → сцена дня → задания
function nowStep(skipCards = false) {
  const pick = suggest();
  const scene = (s) => ({ k: "scene", icon: "chat-teardrop-text-duotone", t: pick ? `Сейчас: ${pick.title}` : "Сейчас: сцена",
    s, go: () => (pick ? openScenario(pick.id) : tab("practice")) });
  const sceneSub = pick && pick.turns ? `сцена дня, ${pick.turns.length} реплик, до ${maxXp(pick)} опыта` : "сцена дня, около 5 минут";
  if (!D || !D.xp) return scene("данных о норме нет, практика работает");
  if (!fresh()) return { k: "refresh", icon: "repeat", t: "Обновить", s: "бот пришлет свежую кнопку мини-аппа", go: refresh };
  const left = Math.max(D.xp.goal - D.xp.today, 0), t = D.tasks;
  const cst = cardsState();                    // F8: сессия в странице; skipCards — «дальше» на итоге повтора
  if (D.due && !skipCards && cst.k !== "sent" && cst.k !== "none") {
    if (cst.k === "chat") return { k: "cards", icon: "cards-duotone", t: `Сейчас: ${D.due} карточек`,
      s: `около ${Math.max(1, Math.round(D.due * 13 / 60))} мин${D.norm ? ", норма уже взята" : `, +${Math.min(Math.round(D.due * 2.5), 999)} к норме дня`}`,
      go: () => send({ kind: "review" }, "Повтор") };
    return { k: "cards", icon: "cards-duotone", t: cst.k === "new" ? `Сейчас: ${cst.now.replace(/^\S/, (x) => x.toLowerCase())}` : cst.now, s: cst.sub, go: cst.go };
  }
  if (D.norm) return { k: "rest", quiet: true, icon: "seal-check-duotone", t: "Норма взята", s: `можно сверху: ${pick ? pick.title : "сцена"}`, go: scene().go };
  if (!D.sp) return { k: "voice", icon: "microphone-duotone", t: "Сейчас: голосовое 2 минуты", s: "речь дня и замер беглости, +20 опыта", go: openVoice };
  if (!D.prt) return scene(sceneSub);
  if (t && !D.sent) {
    const n = tasksCut(t) ? 0 : t.items.filter((it) => has(ANS[it.id])).length;
    return { k: "tasks", icon: "list-checks-duotone", t: `Сейчас: задания, ${tasksN(t)}`, s: tasksCut(t) ? "тексты пришлет бот в чат" : `готово ${n}, ответы ждет репетитор`, go: () => (tasksCut(t) ? toChat() : tab("learn")) };
  }
  return scene(`до нормы ${left} опыта: ${sceneSub}`);
}

function renderHome() {
  const name = (IN_TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.first_name) || "Khan";
  const day = new Date().toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
  const ok = fresh();
  const streak = ok && D.streak && D.streak[0] ? `<span class="streak" title="дней подряд">${ic("flame-duotone")}${D.streak[0]}</span>` : "";
  const st = nowStep();
  let today = "", goal = "", stale = "";
  if (D && D.xp && !ok) {
    const from = D.day ? dm(D.day) : String(D.at || "").slice(0, 5);
    stale = `<p class="stale"><b>Данные от ${esc(from)}${D.day === localDay() ? " без нормы дня" : ""}.</b> Норма, речь и неделя в них не сегодняшние. Обнови:</p>`;
  } else if (D && D.xp) {
    const pick = suggest(), t = D.tasks, lf = D.level && D.level.sub && D.level.sub.f;
    const rows = [];
    if (D.due !== null && D.due !== undefined) {
      const cst = cardsState(), app = cst.k !== "chat" && cst.k !== "none";
      rows.push(["--vocab", D.due === 0 || cst.k === "sent", "Карточки", !D.due ? "все повторено" : app ? cst.sub : `${D.due} к повтору`,
        !D.due ? null : app ? (cst.k === "sent" ? null : [cst.act, cst.go]) : ["Начать", () => send({ kind: "review" }, "Повтор")]]);
    }
    // строку закрывает только голосовое от 60 с; речь дня из сцены говорится отдельно и честно
    rows.push(["--speech", !!D.vs, "Голосовое 2 минуты", D.vs ? `есть, сегодня ${D.min} мин` :
      `${D.sp ? "речь дня есть из сцены, " : ""}замер беглости${lf && lf.d ? ", последний " + dm(lf.d) : ""}`, D.vs ? null : ["Записать", openVoice]]);
    // сцену закрывает только законченная сцена: брошенная и письмо не в счет
    rows.push(["--speech", D.prt > 0, D.prt ? "Сцена" : pick ? `Сцена: ${pick.title}` : "Сцена",
      D.prt ? `законченных сегодня: ${D.prt}` : pick && pick.turns ? `${pick.turns.length} реплик, до ${maxXp(pick)} опыта` : "около 5 минут",
      D.prt ? null : ["Начать", () => (pick ? openScenario(pick.id) : tab("practice"))]]);
    if (t) {
      const n = tasksCut(t) ? 0 : t.items.filter((it) => has(ANS[it.id])).length;
      rows.push(["--prec", !!D.sent, "Задания", D.sent ? "ответы отправлены" : tasksCut(t) ? `${tasksN(t)} заданий: тексты пришлет бот в чат` : `готово ${n} из ${tasksN(t)}`, D.sent ? null : tasksCut(t) ? ["Прислать", toChat] : ["Открыть", () => tab("learn")]]);
    }
    today = `<h2>Сегодня</h2>${rows.map(([c, done, h, p, act], i) => `<div class="todo${done ? " done" : ""}" style="--c:var(${c})"><span class="chk">${ic("check")}</span>
      <div class="tx"><b>${esc(h)}</b><span>${esc(p)}</span></div>${act ? `<button class="go press" data-row="${i}">${act[0]}</button>` : ""}</div>`).join("")}`;
    const x = D.xp, wk = D.wk, wd = (new Date(D.day + "T12:00:00").getDay() + 6) % 7;   // неделя от дня данных
    goal = `<h2>Норма дня</h2><div class="goal-l"><span><b>${x.today} из ${x.goal}</b> опыта</span><span class="sp${D.sp ? "" : " no"}">речь ${D.sp ? "есть" : "нужна"}</span></div>
      <div class="gbar"><u style="width:${Math.min(100, 100 * x.today / x.goal)}%"></u></div>
      <div class="week">${DAYS.map((d, i) => {
        const [v, sp] = wk[i] || [0, 0], met = v >= x.goal && sp;
        const cls = met ? "met" : i > wd ? "future" : i === 6 && !v ? "rest" : "";
        const p = Math.min(sp ? 100 : 90, Math.round(100 * v / x.goal));   // без речи круг не замыкается
        return `<div class="day ${cls}${i === wd ? " today" : ""}"><i style="--p:${p}">${met ? ic("check") : cls === "rest" ? ic("moon") : ""}</i><span>${d}</span></div>`;
      }).join("")}</div>`;
    renderHome.acts = rows.map((r) => r[4] && r[4][1]);
  }
  $("#home").innerHTML = `<div class="hd"><div><p class="mut sm">${esc(day[0].toUpperCase() + day.slice(1))}</p><h1>Привет, ${esc(name)}</h1></div>${streak}</div>
    ${levelHtml(D && D.level)}${stale}
    <button class="now press${st.quiet ? " quiet" : ""}" id="now" data-k="${st.k}">${ic(st.icon)}<span>${esc(st.t)}<small>${esc(st.s)}</small></span>${ic("arrow-right")}</button>
    ${today}${goal}
    ${D && D.at ? `<p class="foot">Данные на ${esc(D.at)}${D.cut ? ", старые точки графиков не влезли" : ""}</p>` : ""}`;
  const lo = $("#lvl-open");
  lo.onclick = () => { haptic(); openLevel(); };
  lo.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLevel(); } };
  $("#now").onclick = () => { haptic("medium"); st.go(); };
  $$("[data-row]", $("#home")).forEach((b) => b.onclick = () => { haptic(); renderHome.acts[+b.dataset.row](); });
}

// сцена дня: одна из двух наименее пройденных рабочих
function suggest() {
  if (!CAT) return null;
  const pr = (D && D.pr) || {};
  const work = CAT.scenarios.filter((s) => s.cat === "interview" || s.cat === "team");
  return work.slice().sort((a, b) => ((pr[a.id] || [0])[0] - (pr[b.id] || [0])[0]))[new Date().getDate() % 2] || null;
}

// ───────────── учить
const KEY = () => "ans-" + (D && D.tasks ? D.tasks.date : "");
function saveLocal() { store.set(KEY(), JSON.stringify(ANS)); }
function loadLocal() { try { return JSON.parse(store.get(KEY(), "{}")); } catch (e) { return {}; } }
const norm = (s) => String(s).trim().toLowerCase().replace(/[.!?]+$/, "").replace(/\s+/g, " ");
const isRight = (ans, v) => [].concat(ans).some((a) => norm(a) === norm(v));
const has = (v) => v !== undefined && v !== "" && !(Array.isArray(v) && !v.length);

function renderLearn() {
  const due = D ? D.due : null, t = D && D.tasks;
  ANS = t && !tasksCut(t) ? loadLocal() : {};
  // карточки цветом словаря, задания цветом точности: те же цвета, что в шкале и в «Сегодня» на главной
  // числа нет: трекер не читается (null) или ссылка урезана (поля нет) — честное «?», а не «все повторено»
  const known = typeof due === "number";
  const cardsHead = !known ? "? к повтору" : due ? `${due} к повтору` : "Все повторено";
  let cardsSub = !known ? (due === null ? "трекер не читается" : "числа нет в ссылке, обнови")
    : due ? `около ${Math.max(1, Math.round(due * 13 / 60))} мин, около ${Math.round(due * 2.5)} опыта (2-3 за карточку)` : "на сегодня карточек нет";
  let cardsAct = known ? (due ? ["go-review", "Повторить"] : null) : D && due === undefined ? ["go-refresh", "Обновить"] : null;
  // F8: карточки в ссылке — сессия в странице; начать новую можно только по сегодняшним данным, начатую — доделать всегда
  const cst = cardsState();
  if (cst.k !== "chat" && cst.k !== "none") { cardsSub = cst.sub; cardsAct = ["go-cards", cst.act]; }
  $("#learn").innerHTML = `<h1>Учить</h1><p class="lead">Карточки из трекера и задания от репетитора</p>
    <h2>Карточки</h2>
    <div class="list"><div class="item" style="--c:var(--vocab)">${ic("cards-duotone")}
      <div class="tx"><b>${cardsHead}</b><span>${cardsSub}</span></div>
      ${cardsAct ? `<button class="go press" id="${cardsAct[0]}">${cardsAct[1]}</button>` : ""}</div></div>
    <h2>Задания</h2>
    ${t && tasksCut(t) ? `<div class="list"><div class="item" style="--c:var(--prec)">${ic("list-checks-duotone")}
      <div class="tx"><b>${tasksN(t)} заданий</b><span>тексты пришлет бот в чат</span></div><button class="go press" id="go-chat">Прислать в чат</button></div></div>` :
    !t ? `<p class="empty">${D && !("tasks" in D) ? "Задания в ссылку не попали, обнови: /app в чате." : "Заданий на сегодня нет. Их кладет репетитор после урока."}</p>` :
      `<div class="goal-l"><span><b id="t-cnt"></b> готово</span><span class="mut">${D.sent ? "уже отправлены, можно еще раз" : "ответы ждет репетитор"}</span></div>
      <div class="gbar"><u id="t-bar" style="width:0;background:var(--prec)"></u></div>` +
      t.items.map((it, k) => `<div class="task" id="it-${esc(it.id)}"><p class="q"><i>${k + 1}</i>${esc(it.prompt)}</p>${body(it)}<div class="res" id="r-${esc(it.id)}"></div></div>`).join("") +
      `<button class="btn press" id="send-tasks" style="margin-top:18px">${ic("check")}Отправить ответы</button>`}`;
  const r = $("#go-review"); if (r) r.onclick = () => { haptic(); send({ kind: "review" }, "Повтор"); };
  const gc0 = $("#go-cards"); if (gc0) gc0.onclick = () => { haptic(); cst.go(); };
  const rf = $("#go-refresh"); if (rf) rf.onclick = () => { haptic(); refresh(); };
  const gc = $("#go-chat"); if (gc) gc.onclick = toChat;
  if (t && !tasksCut(t)) { t.items.forEach(wire); $("#send-tasks").onclick = sendAnswers; count(); }
}
function count() {
  const t = D.tasks, n = t.items.filter((it) => has(ANS[it.id])).length;
  $("#t-cnt").textContent = `${n} из ${t.items.length}`; $("#t-bar").style.width = `${100 * n / t.items.length}%`;
}

function body(it) {
  const v = ANS[it.id] ?? "";
  if (it.type === "choice") return `<div class="opts">${it.options.map((o) => `<button class="chip" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  if (it.type === "gap") return `<input value="${esc(v)}" placeholder="слово${it.hint ? ", подсказка: " + esc(it.hint) : ""}"><div class="opts" style="margin-top:10px"><button class="chip" data-check>Проверить</button></div>`;
  if (it.type === "fix") return `<textarea placeholder="исправленная фраза целиком">${esc(v)}</textarea>`;
  if (it.type === "timer") return `<div class="timer" data-t>${fmt(it.rounds[0])}</div><div class="opts">${it.rounds.map((s, i) => `<button class="chip" data-r="${i}">Раунд ${i + 1}: ${fmt(s)}</button>`).join("")}<button class="chip" data-stop>Стоп</button></div><p class="mut" style="margin-top:8px">Говори голосовым в чат бота, таймер держит время.</p>`;
  return `<p class="mut">Неизвестный тип задания: ${esc(it.type)}</p>`;
}

const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
let TIMER = null;

function wire(it) {
  const box = $(`#it-${CSS.escape(it.id)}`), res = $(`#r-${CSS.escape(it.id)}`);
  const save = (v) => { ANS[it.id] = v; saveLocal(); count(); };
  const verdict = (v) => {
    if (it.answer === undefined) { res.textContent = "Сохранено, проверит репетитор."; return; }
    const ok = isRight(it.answer, v); haptic(ok ? "light" : "rigid");
    res.innerHTML = ok ? `<span class="up">Верно!</span>` : `<span class="down">Верно: ${esc([].concat(it.answer)[0])}</span>`;
  };
  if (it.type === "choice") {
    $$("[data-o]", box).forEach((b) => {
      if (ANS[it.id] === b.dataset.o) { b.classList.add("on"); verdict(b.dataset.o); }
      b.onclick = () => { $$("[data-o]", box).forEach((x) => x.classList.remove("on")); b.classList.add("on"); save(b.dataset.o); verdict(b.dataset.o); };
    });
  } else if (it.type === "gap") {
    const inp = $("input", box);
    inp.oninput = () => { save(inp.value); res.textContent = ""; };
    $("[data-check]", box).onclick = () => {
      if (!inp.value.trim()) { res.innerHTML = `<span class="down">Сначала впиши слово.</span>`; return; }
      save(inp.value); verdict(inp.value);
    };
  } else if (it.type === "fix") {
    const ta = $("textarea", box);
    ta.oninput = () => { save(ta.value); res.textContent = "Сохранено, проверит репетитор."; };
  } else if (it.type === "timer") {
    const out = $("[data-t]", box), done = new Set(ANS[it.id] || []);
    if (done.size) res.textContent = `Пройдено раундов: ${[...done].map((i) => i + 1).join(", ")}`;
    $$("[data-r]", box).forEach((b) => b.onclick = () => {
      clearInterval(TIMER);
      const i = +b.dataset.r; let left = it.rounds[i];
      out.textContent = fmt(left); res.textContent = `Идет раунд ${i + 1}. Говори!`;
      TIMER = setInterval(() => {
        left -= 1; out.textContent = fmt(Math.max(left, 0));
        if (left <= 0) {
          clearInterval(TIMER); done.add(i); save([...done].sort());
          res.textContent = `Раунд ${i + 1} закончен. Пройдено: ${[...done].map((x) => x + 1).join(", ")}`;
          try { IN_TG && TG.HapticFeedback.notificationOccurred("success"); } catch (e) {}
        }
      }, 1000);
    });
    $("[data-stop]", box).onclick = () => { clearInterval(TIMER); res.textContent = "Остановлено, раунд не засчитан."; };
  }
}

function sendAnswers() {
  const filled = D.tasks.items.filter((it) => has(ANS[it.id])).length;
  if (send({ kind: "tasks", date: D.tasks.date, answers: ANS }, "Отправка ответов")) {
    const b = $("#send-tasks"); b.disabled = true; b.textContent = `Отправляю ${filled} из ${D.tasks.items.length}...`;
    setTimeout(() => { b.disabled = false; b.innerHTML = ic("check") + "Отправить ответы"; }, 4000);
  }
}

// ───────────── карточки повтора (SPEC v2.0 F8): вопрос → ответ → оценка, прогресс в localStorage, одна отправка в конце
// карточка в ссылке: [раздел 0-2, ключ-crc, вопрос, ответ, шаг, дата повтора]; шаг и дата уходят назад, бот по ним сверяет трекер
const SEC = [["Слово", "--vocab"], ["Практикум", "--prec"], ["Ошибка", "--prec"]];
const GR = [["n", "Не вспомнил", "--bad"], ["h", "С подсказкой", "--ink"], ["y", "Вспомнил", "--ok"]];   // вспомнил под большим пальцем
// когда карточка вернется: как tracker_io.next_state и INTERVAL (шаг → дней), шаг 5 уходит в архив
const IVL = [1, 3, 7, 14, 30];
function when(step, g) {
  const s = { y: step + 1, h: step, n: 0 }[g];
  if (s >= 5) return "в архив";
  const d = IVL[s];
  return d === 1 ? "завтра" : `через ${d} ${d < 5 ? "дня" : "дней"}`;
}
const cards = () => (D && Array.isArray(D.cards) ? D.cards : []);
const STAGE = (step) => (step <= 0 ? "новое" : step <= 2 ? "закрепляется" : "почти выучено");   // вместо «шаг N»

// <pure> чистые функции сессии; их гоняет node в tests/test_cards_app.py
// Прогресс хранится по карточке (ключ+шаг+дата), а не по списку: новая кнопка с добавленным словом сохраняет оценки,
// карточку, у которой шаг или дата сменились, спрашивает заново.
const cardKey = (c) => `${c[1]}|${c[4]}|${c[5]}`;
function csView(cards, s) {
  const keys = cards.map(cardKey), g = (s && s.g) || {}, sent = (s && s.sent) || {};
  const done = keys.filter((k) => g[k]).length, i = keys.findIndex((k) => !g[k]);
  const unsent = keys.filter((k) => g[k] && !sent[k]).length;
  return { n: keys.length, done, i: i < 0 ? keys.length : i, unsent, sent: keys.length > 0 && done === keys.length && unsent === 0 };
}
// sendData: строка [ключ-crc, раздел, шаг, дата, оценка, свой ответ?], текстов вопросов и ответов нет.
// Не влезает: свои ответы укорачиваются пропорционально, по символам (Array.from не рвет суррогатные пары).
function packGrades(cards, s, sid, limit) {
  const size = (o) => new TextEncoder().encode(JSON.stringify(o)).length;
  const g = (s && s.g) || {};
  const rows = cards.filter((c) => g[cardKey(c)]).map((c) => { const x = g[cardKey(c)]; return [c[1], c[0], c[4], c[5], x[0], String(x[1] || "")]; });
  const obj = { kind: "grades", sid, g: rows }, cut = new Set();
  for (let guard = 0; size(obj) > limit && rows.some((r) => r[5]) && guard < 200; guard++) {
    const tot = rows.reduce((t, r) => t + size(r[5]), 0);
    const k = Math.min(0.95, Math.max(0, 1 - (size(obj) - limit + 16 * rows.length) / Math.max(tot, 1)));
    rows.forEach((r, j) => {
      const cp = Array.from(r[5]), n = Math.floor(cp.length * k);
      if (n < cp.length) { r[5] = cp.slice(0, n).join(""); cut.add(j); }
    });
  }
  rows.forEach((r) => { if (!r[5]) r.pop(); });
  return { obj, cut: cut.size, bytes: size(obj) };
}
// </pure>

// хранилище: одна запись на день данных; отказ localStorage виден в сессии, а не молчит
const csKey = () => `cs-${D && D.day}`;
let CS = null, CS_FAIL = false;
function csLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(csKey()) || "null");
    return s && s.g && typeof s.g === "object" && !Array.isArray(s.g) ? s : null;
  } catch (e) { CS_FAIL = true; return null; }
}
function csSave() { try { localStorage.setItem(csKey(), JSON.stringify(CS)); CS_FAIL = false; } catch (e) { CS_FAIL = true; } }
function csClean() {                                           // сессии старше 2 дней и старый формат ключа уходят
  try {
    const lim = new Date(); lim.setDate(lim.getDate() - 2); const min = localDay(lim);
    for (const k of Object.keys(localStorage)) if (k.startsWith("cs-") && (k.length !== 13 || k.slice(3) < min)) localStorage.removeItem(k);
  } catch (e) {}
}
csClean();

// одна правда о карточках для «Сейчас», строки «Сегодня» и «Учить»
function cardsState() {
  const due = D ? D.due : null, cs = cards(), known = typeof due === "number";
  if (!cs.length) return { k: known && due ? "chat" : "none" };
  const v = csView(cs, csLoad()), n = v.n, more = known ? Math.max(due - n, 0) : 0;
  const min = Math.max(1, Math.round((n - v.done) * 13 / 60));
  const go = () => openCards();
  if (v.sent) return { k: "sent", now: "Повтор отправлен", sub: "ждем ответ бота в чате", act: "Открыть", go };
  if (v.done >= n) return { k: "graded", now: `Сохранить повтор, ${n} из ${n}`, sub: "все оценены, осталось сохранить", act: "Открыть", go };
  if (v.done) return { k: "mid", now: `Продолжить ${v.done + 1} из ${n}`, sub: `остановился на ${v.done + 1} из ${n}, около ${min} мин`, act: "Продолжить", go };
  if (D.day !== localDay()) return { k: "stale", now: "Обновить", sub: `карточки от ${dm(D.day)}, обнови`, act: "Обновить", go: refresh };
  return { k: "new", now: `Повторить ${n} карточек`, sub: `около ${min} мин${more ? `, еще ${more} в следующей сессии` : ""}`, act: "Начать", go };
}

function openCards() {
  const s = csLoad();
  CS = s || { sid: (D.day || localDay()).replace(/-/g, "") + Math.random().toString(36).slice(2, 8), g: {}, sent: {}, cur: null };
  CS.sent = CS.sent || {};
  csSave();
  document.body.classList.add("cs-on");                       // сессия без меню: оценки внизу под пальцем
  try { IN_TG && TG.enableClosingConfirmation(); } catch (e) {}
  tab("learn"); renderCards();
}
function closeCards() {
  CS = null; document.body.classList.remove("cs-on");
  try { IN_TG && TG.disableClosingConfirmation(); } catch (e) {}
  renderLearn(); renderHome(); tab("learn");
}
const failNote = () => (CS_FAIL ? `<p class="card err"><b>Прогресс не сохраняется:</b> хранилище Telegram недоступно. Не закрывай окно до «Сохранить».</p>` : "");

function renderCards() {
  const cs = cards(), v = csView(cs, CS), n = v.n, el = $("#learn");
  if (v.i >= n) return renderCardsDone();
  const c = cs[v.i], key = cardKey(c), [kind, col] = SEC[c[0]] || SEC[0], err = c[0] === 2;
  if (!CS.cur || CS.cur.key !== key) CS.cur = { key, shown: false, draft: "" };
  const cur = CS.cur;
  el.innerHTML = `<div class="cs-top"><h1>Карточки</h1><span class="cs-n">${v.done + 1} из ${n}</span><button class="xb" id="cs-x" aria-label="Закрыть, прогресс сохранится">${ic("x")}</button></div>
    <div class="gbar"><u style="width:${100 * v.done / n}%;background:var(--vocab)"></u></div>${failNote()}
    <div class="fc" style="--c:var(${col})"><em>${kind} · ${err ? "на урок" : STAGE(+c[4])}</em>
      <p class="q">${err ? "Исправь: " : ""}${esc(c[2])}</p>
      ${cur.shown ? `<p class="a">${esc(c[3])}</p>${cur.draft.trim() ? `<p class="mine">Твой ответ: ${esc(cur.draft.trim())}</p>` : ""}${err ? `<p class="mine">Ошибку двигает репетитор на уроке, оценка уйдет ему в журнал.</p>` : ""}`
        : `<input id="cs-mine" maxlength="200" autocomplete="off" placeholder="свой ответ, можно пропустить" value="${esc(cur.draft)}">`}
    </div>
    <div class="cs-bar"><div>${cur.shown ? `<div class="grades">${GR.map(([g, t, cc]) => `<button class="press" data-g="${g}" style="--c:var(${cc})">${t}<small>${err ? "в журнал" : when(+c[4], g)}</small></button>`).join("")}</div>`
      : `<button class="btn press" id="cs-show">Показать ответ</button>`}</div></div>`;
  $("#cs-x").onclick = () => { haptic(); closeCards(); };
  const inp = $("#cs-mine");
  if (inp) {
    inp.oninput = () => { cur.draft = inp.value; csSave(); };
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("#cs-show").click(); } };
  }
  const sh = $("#cs-show");
  if (sh) sh.onclick = () => { haptic(); cur.shown = true; csSave(); renderCards(); };
  $$("[data-g]", el).forEach((b) => b.onclick = () => {
    haptic(b.dataset.g === "y" ? "light" : "rigid");
    CS.g[key] = [b.dataset.g, Array.from(cur.draft.trim()).slice(0, 200).join("")];
    CS.cur = null; csSave(); renderCards();
  });
}

function renderCardsDone() {
  const cs = cards(), v = csView(cs, CS), n = v.n, cnt = { y: 0, h: 0, n: 0 };
  cs.forEach((c) => { const x = CS.g[cardKey(c)]; if (x && x[0] in cnt) cnt[x[0]] += 1; });
  const errs = cs.some((c) => c[0] === 2), more = typeof D.due === "number" && D.due > n;
  const nx = nowStep(true), next = nx.quiet ? `норма взята, ${nx.s}` : nx.t.replace(/^Сейчас: /, "");   // та же логика, что «Сейчас»
  $("#learn").innerHTML = `<div class="cs-top"><h1>Итог повтора</h1><button class="xb" id="cs-x" aria-label="Закрыть">${ic("x")}</button></div>
    <div class="gbar"><u style="width:100%;background:var(--vocab)"></u></div>${failNote()}
    <div class="tally">${GR.slice().reverse().map(([g, t, c]) => `<div style="--c:var(${c})"><b>${cnt[g]}</b>${t.toLowerCase()}</div>`).join("")}</div>
    <p class="note">${errs ? "Ошибки уйдут репетитору в журнал, трекер их не двигает. " : ""}${more ? "Остальные карточки придут в следующей сессии." : ""}</p>
    <p class="next">Дальше: <b>${esc(next)}</b></p>
    ${v.sent ? `<p class="sent"><b>Отправлено.</b> Ждем ответ бота в чате: он запишет оценки в трекер и пришлет свежую кнопку.</p>` : ""}
    <div class="cs-bar"><div>${v.sent ? `<button class="link" id="cs-save">Бот не ответил? Отправить еще раз</button>`
      : `<button class="btn press" id="cs-save">${ic("check")}Сохранить</button>`}</div></div>`;
  $("#cs-x").onclick = () => { haptic(); closeCards(); };
  $("#cs-save").onclick = () => {
    const p = packGrades(cs, CS, CS.sid, LIMIT);
    if (p.bytes > LIMIT) { toast(`Оценки не влезают в отправку: ${p.bytes} байт из ${LIMIT}.`); return; }
    const go = () => {
      if (!send(p.obj, "Сохранение повтора")) return;
      cs.forEach((c) => { if (CS.g[cardKey(c)]) CS.sent[cardKey(c)] = 1; });   // бот принимает пару (sid, ключ) один раз
      csSave();
      try { IN_TG && TG.disableClosingConfirmation(); } catch (e) {}
      renderCardsDone();
    };
    if (!p.cut) return go();
    const msg = `Свои ответы не влезают в отправку целиком: ${p.cut} будут укорочены. Оценки целы. Сохранить?`;
    if (IN_TG && TG.showConfirm) { try { return TG.showConfirm(msg, (ok) => ok && go()); } catch (e) {} }
    if (confirm(msg)) go();
  };
}

// ───────────── практика
const byId = (id) => CAT && CAT.scenarios.find((s) => s.id === id);
// цвет по виду работы, а не по разделу (VISION: три смысловых цвета): сцены и разговор — речь,
// рассказ из слов трекера — словарь, письмо — точность. Цвета из scenarios.json (пастель Word Trip) не берем.
const kindColor = (s) => s.kind === "words" ? "--vocab" : s.kind === "writing" ? "--prec" : "--speech";
const maxXp = (s) => s.kind === "writing" ? 25 : s.kind === "words" ? 10 + 5 * (s.pick || 5) : 10 + 5 * (s.goals || []).length;
function rowHtml(s, pick) {
  const p = D && D.pr && D.pr[s.id], today = pick && pick.id === s.id;
  const pass = p ? `<span class="pass" title="пройдена ${p[0]} раз${p[2] ? `, лучшее ${p[1]} из ${p[2]} целей` : ""}">${ic("check")}${p[2] ? `${p[1]}/${p[2]}` : `${p[0]}×`}</span>` : "";
  // сцена дня (та же, что в «Сейчас» и «Сегодня» на главной): метка и действие, остальные строки тихие
  return `<button class="item press${today ? " pick" : ""}" style="--c:var(${kindColor(s)})" data-sc="${esc(s.id)}">${ic(s.icon)}
    <div class="tx">${today ? `<em>Сцена дня</em>` : ""}<b>${esc(s.title)}</b><span>${esc(s.sub)}</span></div>${today ? `<span class="go">Начать</span>` : pass}</button>`;
}
function wireRows(root) { $$("[data-sc]", root).forEach((b) => b.onclick = () => { haptic(); openScenario(b.dataset.sc); }); }

function renderPractice() {
  if (!CAT) { $("#practice").innerHTML = `<h1>Практика</h1><div class="card err"><b>Сценарии не загрузились.</b><br>Проверь интернет и открой мини-апп заново.</div>`; return; }
  const quick = CAT.quick.map(byId).filter(Boolean), pick = suggest();
  $("#practice").innerHTML = `
    <h1>Практика</h1>
    <p class="lead">Собеседник пишет в чат, ты отвечаешь голосом</p>
    <div class="quick">${quick.map((s) => `<button class="press" style="--c:var(${kindColor(s)})" data-sc="${esc(s.id)}">${ic(s.icon)}<b>${esc(s.title)}</b></button>`).join("")}</div>
    ${CAT.cats.map((c) => `<h2>${esc(c.title)}</h2><div class="list">${CAT.scenarios.filter((s) => s.cat === c.id).map((s) => rowHtml(s, pick)).join("")}</div>`).join("")}`;
  wireRows($("#practice"));
}

let SHEET_FROM = null;
function openSheet(html) {
  if (!$("#sheet").classList.contains("open")) SHEET_FROM = document.activeElement;
  $("#sheet-body").innerHTML = html;
  $("#veil").classList.add("open"); $("#sheet").classList.add("open");
  $("#sheet").scrollTop = 0;
  $$("[data-close]", $("#sheet")).forEach((b) => b.onclick = closeSheet);
  $("#sheet").tabIndex = -1; $("#sheet").focus({ preventScroll: true });
  if (IN_TG) { try { TG.BackButton.show(); } catch (e) {} }
}
function closeSheet() {
  $("#veil").classList.remove("open"); $("#sheet").classList.remove("open");
  if (SHEET_FROM && SHEET_FROM.isConnected) { try { SHEET_FROM.focus({ preventScroll: true }); } catch (e) {} }
  SHEET_FROM = null;
  if (IN_TG) { try { TG.BackButton.hide(); } catch (e) {} }
}
$("#veil").onclick = closeSheet;
addEventListener("keydown", (e) => {
  const sh = $("#sheet"); if (!sh.classList.contains("open")) return;
  if (e.key === "Escape") return closeSheet();
  if (e.key !== "Tab") return;
  const f = [...sh.querySelectorAll("button, [href], input, textarea, [tabindex]:not([tabindex='-1'])")].filter((x) => !x.disabled);
  if (!f.length) return;
  const a = document.activeElement, first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (a === first || a === sh)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
});
if (IN_TG) { try { TG.BackButton.onClick(closeSheet); } catch (e) {} }

function openScenario(id) {
  const s = byId(id);
  if (!s) { toast("Такого сценария нет. Обнови мини-апп: /app в чате."); return; }
  if (s.kind === "writing") return openWriting(s);
  let lvl = store.get("lvl-" + id, "B1");
  const goals = s.kind === "words" ? ["Бот возьмет 5 слов из твоего трекера", "Собери из них короткую историю голосом", "Итог покажет, какие слова прозвучали"] : s.goals.map((g) => g.t);
  const hard = s.hard ? s.hard.length : 0;
  const levels = Object.keys(CAT.levels).filter((k) => k !== "B2" || hard || s.kind !== "scenario");
  openSheet(`
    <div class="head" style="--c:var(${kindColor(s)})"><h1>${ic(s.icon)}${esc(s.title)}</h1><button class="x" data-close aria-label="Закрыть">${ic("x")}</button></div>
    <p class="lead" style="margin-top:8px">${esc(s.sub)}.${s.who ? ` Собеседник: ${esc(s.who)}.` : ""}</p>
    <div class="cap">Цели</div>
    <div style="--c:var(${kindColor(s)})">${goals.map((g) => `<div class="goal"><i class="gd"></i><span>${esc(g)}</span></div>`).join("")}</div>
    <div class="cap">Сложность</div>
    <div class="opts">${levels.map((k) => `<button class="chip${k === lvl ? " on" : ""}" data-l="${k}">${k}</button>`).join("")}</div>
    <p class="mut" id="lvl-d" style="margin-top:8px"></p>
    <p class="note"><span id="n-turns"></span>. Отвечай в чате голосовым или текстом. В конце бот покажет цели, число слов, темп и опыт. Смысл и грамматику разберет репетитор на уроке.</p>
    <button class="btn press" id="go">${ic("play")}Начать</button>`);
  const desc = () => {
    $("#lvl-d").textContent = CAT.levels[lvl] || "";
    $("#n-turns").textContent = s.turns ? `${s.turns.length + (lvl === "B2" ? hard : 0)} реплик` : s.kind === "pool" ? `${s.pick} вопроса` : "Две реплики";
  };
  desc();
  $$("[data-l]", $("#sheet")).forEach((b) => b.onclick = () => {
    haptic(); lvl = b.dataset.l; store.set("lvl-" + id, lvl);
    $$("[data-l]", $("#sheet")).forEach((x) => x.classList.toggle("on", x === b)); desc();
  });
  $("#go").onclick = () => send({ kind: "practice", id, level: lvl }, "Запуск сцены");
}

function openWriting(s) {
  const prompts = CAT.writing || [];
  let k = 0;
  openSheet(`
    <div class="head" style="--c:var(${kindColor(s)})"><h1>${ic(s.icon)}${esc(s.title)}</h1><button class="x" data-close aria-label="Закрыть">${ic("x")}</button></div>
    <p class="lead" style="margin-top:8px">Напиши по-английски, репетитор разберет ошибки на уроке.</p>
    <div class="cap">Тема</div>
    <div class="opts">${prompts.map((p, i) => `<button class="chip${i ? "" : " on"}" data-p="${i}">${i + 1}</button>`).join("")}</div>
    <p style="margin:12px 0" id="wp-t">${esc(prompts[0] || "")}</p>
    <textarea id="wt" style="min-height:150px" placeholder="Your text in English...">${esc(store.get("w-draft", ""))}</textarea>
    <p class="mut" id="wc" style="margin:6px 0 16px"></p>
    <button class="btn press" id="wsend">${ic("note-pencil-duotone")}Отправить репетитору</button>`);
  const wt = $("#wt"), wc = () => { const n = (wt.value.match(/[A-Za-z']+/g) || []).length; $("#wc").textContent = `${n} слов`; };
  wc();
  wt.oninput = () => { wc(); store.set("w-draft", wt.value); };
  $$("[data-p]", $("#sheet")).forEach((b) => b.onclick = () => {
    k = +b.dataset.p; $$("[data-p]", $("#sheet")).forEach((x) => x.classList.toggle("on", x === b)); $("#wp-t").textContent = prompts[k];
  });
  $("#wsend").onclick = () => {
    if (!wt.value.trim()) { toast("Сначала напиши текст."); return; }
    if (send({ kind: "writing", prompt: prompts[k], text: wt.value.trim() }, "Отправка текста")) store.set("w-draft", "");
  };
}

// ───────────── прогресс
function renderStats() {
  if (!D || !D.form || !D.xp) { $("#stats").innerHTML = `<h1>Прогресс</h1><p class="empty">Данных нет. Отправь боту /app и открой мини-апп кнопкой внизу чата.</p>`; return; }
  const f = D.form, rec = D.rec || [], ps = D.ps || [], lg = D.xp.lg || {}, st = D.streak || [0, 0];
  // награды компактно: взятые и по одной ближайшей невзятой из каждого ряда (серия, карточки, ступени).
  // Награды за лиги остаются в данных, но не на виду: лиги тихие, их место одна строка внизу.
  const all = (D.ach || []).filter((a) => !String(a[0]).startsWith("Лига ")), got = all.filter((a) => a[1]).length, seen = new Set();
  const ach = [...all.filter((a) => a[1]), ...all.filter((a) => {
    const k = String(a[0]).replace(/\d+/g, "#").replace(/карточ[а-я]+/, "карточ");   // «1 карточка» и «10 карточек» один ряд
    return !a[1] && !seen.has(k) && seen.add(k);
  })];
  const pr = Object.entries(D.pr || {}).map(([id, v]) => [byId(id), v]).filter(([s]) => s).sort((a, b) => b[1][0] - a[1][0]);
  const blk = (h, sub, ch) => `<div class="blk"><h3>${h}</h3><p class="mut">${sub}</p>${ch}</div>`;
  // SPEC v4 F5: речь первой, форма под именем «Регулярность», лига и опыт одной строкой внизу; название лиги только из данных бота.
  // Вчерашняя ссылка (урок 2026-11-09): неделю не выдаем за текущую, строка говорит, от какого дня данные
  const ok = fresh(), from = D.day ? dm(D.day) : String(D.at || "").slice(0, 5);
  const week = ok ? `${lg.sum ?? 0} за неделю${typeof lg.prev === "number" ? `, прошлая ${lg.prev}` : ""}` : `данные от ${esc(from)}, обнови`;
  const lgLine = lg.name ? `Лига <b>${esc(lg.name)}</b> · ${week} · ` : ok ? "" : `Данные от ${esc(from)} · `;
  $("#stats").innerHTML = `<h1>Прогресс</h1><p class="lead">Речь, регулярность и награды</p>
    <h2>Речь</h2>
    ${blk("Темп речи", "слов в минуту", chart(rec.map((r) => r[1]), rec.map((r) => r[0]), { min: 0, c: "--speech" }))}
    ${blk("Паузы длиннее 2 с", "в минуту, чем ниже, тем лучше", chart(rec.map((r) => r[2]), rec.map((r) => r[0]), { min: 0, c: "--speech" }))}
    ${blk("Past simple верно", "в рассказах, %", chart(ps.map((r) => r[1]), ps.map((r) => r[0]), { suffix: "%", min: 0, max: 100, c: "--prec" }))}
    <h2>Регулярность</h2>
    ${blk(`<b>${f.now}</b>`, `серия ${st[0]}, рекорд ${st[1]}; пропуск дня снимает 10%`, chart(f.s, [formStart(f), ok ? "сегодня" : from], { min: 0, area: true, c: "--fg" }))}
    ${pr.length ? `<h2>Сцены</h2><div class="list tight">${pr.map(([s, v]) => `<div class="item" style="--c:var(${kindColor(s)})">${ic(s.icon)}<div class="tx"><b>${esc(s.title)}</b></div><small>${v[0]} раз${v[2] ? `, лучшее ${v[1]} из ${v[2]}` : ""}</small></div>`).join("")}</div>` : ""}
    <h2>Награды · ${got} из ${all.length}</h2>
    <div class="list tight">${ach.map(([t, g, p]) => `<div class="item${g ? "" : " no"}" style="--c:var(${g ? "--fg" : "--mut"})">${ic(g ? "seal-check-duotone" : "lock")}<div class="tx"><b>${esc(t)}</b></div><small>${esc(p)}</small></div>`).join("")}</div>
    <p class="lg-line">${lgLine}<span>опыта всего <b>${D.xp.total}</b></span></p>
    <div class="thm"><span>Тема</span><div role="group" aria-label="Тема">${THEMES.map(([k, t]) => `<button class="press${store.get("theme", "auto") === k ? " on" : ""}" data-th="${k}">${t}</button>`).join("")}</div></div>`;
  $("#stats").querySelectorAll("[data-th]").forEach((b) => b.onclick = () => { store.set("theme", b.dataset.th); theme(); renderStats(); });
}

// ───────────── старт
(async () => {
  const z = new URLSearchParams((window.__HASH || "").slice(1)).get("z");
  const catP = fetch("scenarios.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((c) => { CAT = c; }).catch((e) => showErr([`Сценарии не загрузились: ${e.message || e}`]));
  if (!z) showErr(["В ссылке нет данных. Открой мини-апп кнопкой «📊 Прогресс» в чате бота (/app обновит кнопку)."]);
  else {
    try { D = await decode(z); showErr(D.err || []); }
    catch (e) { showErr([`Данные в ссылке повреждены (${e.message || e}). Отправь боту /app и открой новую кнопку.`]); }
  }
  await catP;
  renderLearn(); renderPractice(); renderStats(); renderHome();
  tab("home");
  setTimeout(celebrate, 700);
})().catch((e) => showErr([`Сбой страницы: ${e.message || e}`]));
window.addEventListener("error", (e) => showErr([`Сбой страницы: ${e.message}`]));
</script>
