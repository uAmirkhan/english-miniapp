<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English с Khan</title>
<!-- Данные приходят во фрагменте ссылки (#z=...), фрагмент не уходит на сервер.
     Читаем его ДО скрипта Telegram: тот дописывает в hash свои параметры. -->

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf6ef; --card: #fff; --fg: #2b2420; --mut: #8a7f76; --line: #efe5d8;
  --acc: #f0713e; --acc-dk: #d35a2b; --acc-soft: #fde6da; --ok: #4f9a5b; --ok-dk: #3d7d48; --bad: #d9534f; --gold: #e9a92c;
  --coral-bg: #fde4d8; --coral: #e8693a; --honey-bg: #fcefcf; --honey: #c98a12; --sage-bg: #e4eedd; --sage: #5a8c55;
  --rose-bg: #fbe3e6; --rose: #d2566b; --plum-bg: #efe5f3; --plum: #8d5ba6; --sand-bg: #f3eadd; --sand: #a7794b;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1b1714; --card: #26201c; --fg: #f5ede6; --mut: #a89c92; --line: #3a312a;
  --acc: #ff8a57; --acc-dk: #c9643a; --acc-soft: #3f2a20; --ok: #7cc387; --ok-dk: #4f8f5a; --bad: #ff7a74; --gold: #f2c25b;
  --coral-bg: #3d2519; --coral: #ff9b70; --honey-bg: #3a2e14; --honey: #f2c25b; --sage-bg: #22301f; --sage: #8fc487;
  --rose-bg: #3a1f24; --rose: #f08a9a; --plum-bg: #2f2336; --plum: #c49bdb; --sand-bg: #352b20; --sand: #d7ae80;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 700 15px/1.45 Nunito, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(100px + env(safe-area-inset-bottom)); }
h1 { font-size: 30px; font-weight: 900; letter-spacing: -.01em; margin: 6px 0 2px; line-height: 1.15; }
h2 { font-size: 20px; font-weight: 900; margin: 26px 0 12px; }
h3 { font-size: 17px; font-weight: 800; margin: 0; }
p { margin: 0; }
.mut { color: var(--mut); font-size: 14px; font-weight: 700; }
.lead { color: var(--mut); font-size: 16px; font-weight: 700; }
.hidden { display: none !important; }
.ic { width: 24px; height: 24px; flex: none; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:disabled { opacity: .55; cursor: default; }

/* появление и отклик: короткие, без навязчивости */
.in > * { animation: up .35s cubic-bezier(.2, .8, .2, 1) both; }
.in > *:nth-child(2) { animation-delay: .04s; } .in > *:nth-child(3) { animation-delay: .08s; }
.in > *:nth-child(4) { animation-delay: .12s; } .in > *:nth-child(n+5) { animation-delay: .16s; }
@keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .in > * { animation: none; } }

/* карточки: плоские, с кромкой */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; margin: 12px 0; }
.err { border-color: var(--bad); }
.err b { color: var(--bad); }
.press { transition: transform .1s ease, box-shadow .1s ease; }
.press:active { transform: translateY(2px); }

/* верхняя полоса: серия и опыт */
.top { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.chips { display: flex; gap: 6px; }
.stat { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 99px; border: 2px solid var(--line); background: var(--card); font-weight: 900; font-size: 15px; white-space: nowrap; }
.stat .ic { width: 18px; height: 18px; }
.s-fire { color: var(--acc); } .s-xp { color: var(--gold); }

/* цель дня */
.goal-card { display: flex; gap: 16px; align-items: center; }
.ring { position: relative; width: 104px; height: 104px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 11; }
.ring .bgc { stroke: var(--acc-soft); }
.ring .fgc { stroke: var(--acc); stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1); }
.ring.done .fgc { stroke: var(--ok); }
.ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1; }
.ring .c b { font-size: 26px; font-weight: 900; display: block; }
.ring .c span { font-size: 12px; color: var(--mut); }
.week { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 14px; border-top: 2px solid var(--line); }
.day { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; color: var(--mut); width: 36px; }
.day i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--acc) calc(var(--p) * 1%), var(--acc-soft) 0); position: relative; }
.day i::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--card); }
.day.met i { background: var(--acc); } .day.met i::after { display: none; }
.day.met i .ic { width: 16px; height: 16px; color: #fff; position: relative; z-index: 1; }
.day.rest i { background: var(--line); } .day.rest i::after { display: none; }
.day.rest i .ic { width: 14px; height: 14px; color: var(--mut); z-index: 1; }
.day.today span { color: var(--acc); font-weight: 900; }
.day.future i { background: var(--line); opacity: .55; } .day.future i::after { display: none; }

/* лига */
.league { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; }
.badge-lg { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; color: #fff; flex: none; background: var(--lc); box-shadow: 0 4px 0 color-mix(in srgb, var(--lc) 70%, #000); }
.badge-lg .ic { width: 30px; height: 30px; }
.league .tx { flex: 1; min-width: 0; }
.lbar { position: relative; height: 12px; border-radius: 8px; background: var(--line); margin-top: 8px; }
.lbar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: var(--lc); transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.lbar > em { position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: 2px; background: var(--bad); opacity: .6; }
.chev { color: var(--mut); width: 20px; height: 20px; }
.ladder { display: flex; flex-direction: column-reverse; gap: 8px; }
.rung { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; border: 2px solid var(--line); }
.rung .badge-lg { width: 38px; height: 38px; border-radius: 12px; box-shadow: none; } .rung .badge-lg .ic { width: 20px; height: 20px; }
.rung.cur { border-color: var(--lc); background: color-mix(in srgb, var(--lc) 12%, transparent); }
.rung.locked { opacity: .45; }
.rung span { margin-left: auto; font-size: 13px; color: var(--mut); }

/* быстрые режимы: карточки со значком и наградой */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.mode { display: flex; flex-direction: column; gap: 10px; text-align: left; border-radius: 20px; padding: 14px; background: var(--card); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.mode:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.mode .sq { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--t-bg); color: var(--t-fg); }
.mode h3 { font-size: 16px; line-height: 1.2; }
.mode p { color: var(--mut); font-size: 13px; line-height: 1.3; flex: 1; }
.mode .pill { align-self: flex-start; }
.c-coral { --t-bg: var(--coral-bg); --t-fg: var(--coral); } .c-honey { --t-bg: var(--honey-bg); --t-fg: var(--honey); }
.c-sage { --t-bg: var(--sage-bg); --t-fg: var(--sage); } .c-rose { --t-bg: var(--rose-bg); --t-fg: var(--rose); }
.c-plum { --t-bg: var(--plum-bg); --t-fg: var(--plum); } .c-sand { --t-bg: var(--sand-bg); --t-fg: var(--sand); }

/* строки сценариев */
.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 14px; margin: 10px 0; box-shadow: 0 3px 0 var(--line); }
.row:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.row .dot { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; background: var(--t-bg); color: var(--t-fg); flex: none; }
.row .tx { flex: 1; min-width: 0; }
.row .tx p { color: var(--mut); font-size: 14px; line-height: 1.35; margin-top: 2px; }
.pill { flex: none; font-size: 13px; font-weight: 900; padding: 4px 10px; border-radius: 99px; background: var(--honey-bg); color: var(--honey); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }

/* сегодня */
.todo { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 2px solid var(--line); }
.todo:last-child { border-bottom: 0; padding-bottom: 0; } .todo:first-child { padding-top: 0; }
.todo .chk { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2.5px solid var(--line); color: transparent; flex: none; }
.todo.done .chk { background: var(--ok); border-color: var(--ok); color: #fff; }
.todo .chk .ic { width: 15px; height: 15px; }
.todo .tx { flex: 1; } .todo .tx p { color: var(--mut); font-size: 13.5px; }
.todo button { font-weight: 900; color: var(--acc); background: var(--acc-soft); border-radius: 99px; padding: 7px 14px; font-size: 14px; }

/* прогресс */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.kpi { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 14px; }
.kpi .ic { color: var(--t-fg); width: 22px; height: 22px; margin-bottom: 8px; }
.kpi b { font-size: 24px; font-weight: 900; display: block; line-height: 1.1; }
.chart { width: 100%; height: 130px; display: block; margin-top: 10px; overflow: visible; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ach div { border-radius: 16px; padding: 12px; background: var(--bg); font-size: 13.5px; font-weight: 800; display: flex; gap: 10px; align-items: center; }
.ach .ic { width: 22px; height: 22px; flex: none; }
.ach .got { background: var(--honey-bg); } .ach .got .ic { color: var(--honey); }
.ach .no { opacity: .5; } .ach span { display: block; font-weight: 700; color: var(--mut); font-size: 12px; }

/* задания и формы */
.task p.q { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); border-radius: 14px; padding: 9px 16px; font-weight: 800; background: var(--card); box-shadow: 0 3px 0 var(--line); }
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.chip.on { background: var(--acc-soft); color: var(--acc); border-color: var(--acc); box-shadow: 0 3px 0 var(--acc); }
input, textarea { width: 100%; font: inherit; font-weight: 700; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); outline: none; }
input:focus, textarea:focus { border-color: var(--acc); }
textarea { min-height: 76px; resize: vertical; }
.res { margin-top: 8px; font-size: 14px; min-height: 1em; font-weight: 800; }
.up { color: var(--ok); } .down { color: var(--bad); }
.timer { font-size: 56px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; margin: 4px 0 10px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 16px; font-weight: 900; font-size: 16px; letter-spacing: .02em; text-transform: uppercase; background: var(--acc); color: #fff; box-shadow: 0 4px 0 var(--acc-dk); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--acc-dk); }
.btn.green { background: var(--ok); box-shadow: 0 4px 0 var(--ok-dk); }
.btn .ic { width: 20px; height: 20px; }
.bar { height: 12px; border-radius: 8px; background: var(--line); overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; border-radius: 8px; background: var(--acc); transition: width .6s ease; }
.mini { display: flex; align-items: center; gap: 12px; }
.mini .sq { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--t-bg); color: var(--t-fg); flex: none; }

/* нижнее меню */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 2px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
nav div { max-width: 560px; margin: 0 auto; display: flex; gap: 6px; }
nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; color: var(--mut); padding: 6px 0 4px; border-radius: 14px; border: 2px solid transparent; }
nav button .ic { width: 25px; height: 25px; }
nav button.on { color: var(--acc); background: var(--acc-soft); border-color: color-mix(in srgb, var(--acc) 35%, transparent); }

/* шторка */
.veil { position: fixed; inset: 0; z-index: 10; background: rgba(30, 20, 12, .45); opacity: 0; pointer-events: none; transition: opacity .25s; }
.veil.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 88vh; overflow-y: auto; background: var(--card); border-radius: 26px 26px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
.sheet.open { transform: none; }
.sheet > div { max-width: 560px; margin: 0 auto; }
.sheet .x { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--mut); background: var(--bg); flex: none; }
.sheet h1 { font-size: 26px; margin: 0; }
.cap { font-size: 12.5px; font-weight: 900; letter-spacing: .07em; color: var(--mut); text-transform: uppercase; margin: 20px 0 8px; }
.goal { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; font-size: 15.5px; }
.goal .ic { width: 20px; height: 20px; color: var(--ok); margin-top: 1px; }
.note { margin: 18px 0 16px; font-size: 14px; color: var(--mut); }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.celebrate { text-align: center; padding: 6px 0 4px; }
.celebrate .badge-lg { margin: 0 auto 14px; width: 84px; height: 84px; border-radius: 26px; animation: pop .6s cubic-bezier(.2, .8, .2, 1) both; }
.celebrate .badge-lg .ic { width: 44px; height: 44px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 20; max-width: 528px; margin: 0 auto; background: #2b2420; color: #fff; padding: 13px 16px; border-radius: 16px; font-size: 14px; opacity: 0; transform: translateY(10px); transition: .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
:root[data-theme="dark"] .toast { background: #4a3a30; }
#confetti { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
</style>
</head>
<body>
<main>
  <div id="errs"></div>
  <section id="home"></section>
  <section id="learn" class="hidden"></section>
  <section id="practice" class="hidden"></section>
  <section id="stats" class="hidden"></section>
</main>
<nav><div>
  <button data-tab="home" class="on"></button>
  <button data-tab="learn"></button>
  <button data-tab="practice"></button>
  <button data-tab="stats"></button>
</div></nav>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>
<canvas id="confetti" class="hidden"></canvas>
<script>

const TG = window.Telegram && Telegram.WebApp;
const IN_TG = !!(TG && TG.platform && TG.platform !== "unknown");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ic = (n, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ICONS.star}</svg>`;
const LIMIT = 4096;   // sendData режется по БАЙТАМ, не символам
const LEAGUE_COLORS = ["#c98a5a", "#9aa7b3", "#e9a92c", "#3d7bd9", "#d9415a", "#2fa36b", "#9b59d0", "#c8a98a", "#4a423c", "#38b6d9"];
const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
let D = null, CAT = null, ANS = {}, TAB = "home";
const ERRS = [];
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// ───────────── тема: Telegram сам говорит, светлая или темная
function theme() {
  const dark = IN_TG ? TG.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (IN_TG) {
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    try { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } catch (e) { /* старый клиент */ }
  }
}
if (IN_TG) { TG.ready(); TG.expand(); TG.onEvent("themeChanged", theme); }
theme();

const haptic = (k = "light") => { try { IN_TG && TG.HapticFeedback.impactOccurred(k); } catch (e) {} };
function toast(msg, ms = 4200) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), ms);
}
function showErr(list) {
  ERRS.push(...list);
  $("#errs").innerHTML = ERRS.length ? `<div class="card err"><b>Ошибки данных</b><br>${ERRS.map(esc).join("<br>")}</div>` : "";
}

// sendData закрывает мини-апп, бот отвечает в чате. Работает только из кнопки внизу чата.
function send(obj, what) {
  const payload = JSON.stringify(obj);
  const bytes = new Blob([payload]).size;
  if (bytes > LIMIT) { toast(`Слишком длинно: ${bytes} байт из ${LIMIT}. Сократи текст.`); return false; }
  if (!IN_TG) { toast(`Страница открыта не из Telegram. ${what} работает из кнопки «📊 Прогресс» внизу чата бота.`); return false; }
  try { haptic("medium"); TG.sendData(payload); }
  catch (e) { toast(`Не отправилось: ${e.message || e}. Открой мини-апп кнопкой «📊 Прогресс» внизу чата.`); return false; }
  setTimeout(() => toast("Telegram не закрыл окно, значит команда не ушла. Открой мини-апп кнопкой «📊 Прогресс» внизу чата, не под сообщением.", 7000), 4000);
  return true;
}

async function decode(z) {
  const b64 = z.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((z.length + 3) % 4);
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  if (!("DecompressionStream" in window)) throw new Error("этот Telegram слишком старый: нет DecompressionStream, обнови приложение");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

// ───────────── вкладки
const TABS = { home: ["house", "Главная"], learn: ["book-open", "Учить"], practice: ["mic", "Практика"], stats: ["chart-line", "Прогресс"] };
$$("nav button").forEach((b) => {
  const [i, t] = TABS[b.dataset.tab]; b.innerHTML = ic(i) + t;
  b.onclick = () => { haptic(); tab(b.dataset.tab); };
});
function tab(name) {
  TAB = name;
  $$("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  for (const k of Object.keys(TABS)) {
    const el = $("#" + k); el.classList.toggle("hidden", k !== name);
    if (k === name) { el.classList.remove("in"); void el.offsetWidth; el.classList.add("in"); }
  }
  scrollTo({ top: 0 });
  animate($("#" + name));
}

// числа и полосы набегают от нуля: маленькая награда за открытие
function animate(root) {
  requestAnimationFrame(() => setTimeout(() => {
    $$("[data-off]", root).forEach((c) => c.style.strokeDashoffset = c.dataset.off);
    $$("[data-w]", root).forEach((b) => b.style.width = b.dataset.w);
    $$("[data-count]", root).forEach((el) => {
      const to = +el.dataset.count, t0 = performance.now();
      if (!to || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = to; return; }
      const step = (t) => { const k = Math.min((t - t0) / 700, 1); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }, 60));
}

// ───────────── графики
function chart(values, labels, { suffix = "", max = null, min = null, area = false } = {}) {
  const pts = values.map((v, i) => [i, v]).filter(([, v]) => v !== null && v !== undefined);
  if (!pts.length) return `<p class="mut" style="margin-top:8px">Пока нет данных.</p>`;
  const W = 300, H = 120, P = 14;
  const lo = min ?? Math.min(...pts.map((p) => p[1])), hi = max ?? Math.max(...pts.map((p) => p[1]));
  const span = hi - lo || 1, n = Math.max(values.length - 1, 1);
  const xy = pts.map(([i, v]) => [P + (i / n) * (W - 2 * P), H - 22 - ((v - lo) / span) * (H - 22 - P)]);
  const line = xy.map((p) => p.map((x) => x.toFixed(1)).join(",")).join(" ");
  const last = xy[xy.length - 1], lv = pts[pts.length - 1][1];
  const fill = area && xy.length > 1 ? `<polygon fill="var(--acc)" opacity=".12" points="${xy[0][0]},${H - 22} ${line} ${last[0]},${H - 22}"/>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${fill}
    <polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${line}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--card)" stroke="var(--acc)" stroke-width="3" vector-effect="non-scaling-stroke"/>
    <text x="${Math.min(last[0], W - 44)}" y="${Math.max(last[1] - 10, 12)}" font-size="13" font-weight="900" fill="var(--fg)">${esc(lv)}${suffix}</text>
    <text x="${P}" y="${H - 4}" font-size="11" fill="var(--mut)">${esc(labels[0] ?? "")}</text>
    <text x="${W - P}" y="${H - 4}" font-size="11" fill="var(--mut)" text-anchor="end">${esc(labels[labels.length - 1] ?? "")}</text></svg>`;
}

// ───────────── лиги
const LEAGUES = ["Бронза", "Серебро", "Золото", "Сапфир", "Рубин", "Изумруд", "Аметист", "Жемчуг", "Обсидиан", "Алмаз"];
const badge = (k) => `<div class="badge-lg" style="--lc:${LEAGUE_COLORS[k]}">${ic(k >= 9 ? "crown" : k >= 3 ? "gem" : "shield")}</div>`;
function leagueText(lg) {
  if (lg.up === null) return lg.sum >= lg.down ? "Вершина. Держи неделю выше порога" : `До безопасной зоны ${lg.down - lg.sum}`;
  if (lg.sum >= lg.up) return `Зона повышения! В понедельник ${LEAGUES[lg.k + 1]}`;
  if (lg.k > 0 && lg.sum < lg.down) return `Еще ${lg.down - lg.sum}, чтобы не опуститься`;
  return `До повышения ${lg.up - lg.sum}`;
}
function openLadder() {
  const lg = D.xp.lg;
  openSheet(`<div class="head"><h1>Лиги</h1><button class="x" data-close aria-label="Закрыть">${ic("x")}</button></div>
    <p class="lead" style="margin-top:8px">Неделя с понедельника по воскресенье. Набрал порог, поднимаешься. Меньше нижнего порога, опускаешься. Соперник один: ты прошлой недели.</p>
    <div class="ladder" style="margin-top:16px">${LEAGUES.map((n, k) => `<div class="rung ${k === lg.k ? "cur" : ""} ${k > lg.best + 1 && k !== lg.k ? "locked" : ""}" style="--lc:${LEAGUE_COLORS[k]}">${badge(k)}<h3>${n}</h3><span>${k < 9 ? `↑ ${150 + 50 * k}` : "вершина"}${k ? ` · ↓ ${60 + 30 * k}` : ""}</span></div>`).join("")}</div>
    <p class="note">Опыт: карточка 2-3, минута речи 10, сцена 10 и 5 за каждую цель, письмо до 25, урок с репетитором 40. Цель дня ${D.xp.goal}.</p>`);
}

// праздник раз в день и при повышении; падение лиги без шума
function celebrate() {
  if (!D || !D.xp) return;
  const today = new Date().toISOString().slice(0, 10), lg = D.xp.lg;
  const lastK = +store.get("lg-k", lg.k);
  store.set("lg-k", lg.k);
  if (lg.k > lastK) {
    confetti();

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  try { IN_TG && TG.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  const cv = $("#confetti"), cx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.classList.remove("hidden"); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ["#f0713e", "#e9a92c", "#5a8c55", "#d2566b", "#8d5ba6"];
  const ps = Array.from({ length: 70 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 4, r: Math.random() * 6, c: cols[Math.random() * cols.length | 0], w: 6 + Math.random() * 5 }));
  const t0 = performance.now();
  const frame = (t) => {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += .12; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -3, p.w, 6); cx.restore(); }
    if (t - t0 < 1800) requestAnimationFrame(frame); else cv.classList.add("hidden");
  };
  requestAnimationFrame(frame);
}

// сцена дня: одна из двух наименее пройденных рабочих
function suggest() {
  if (!CAT) return null;
  const pr = (D && D.pr) || {};

  return work.slice().sort((a, b) => ((pr[a.id] || [0])[0] - (pr[b.id] || [0])[0]))[new Date().getDate() % 2] || null;

// ───────────── учить
const KEY = () => "ans-" + (D && D.tasks ? D.tasks.date : "");
function saveLocal() { store.set(KEY(), JSON.stringify(ANS)); }
function loadLocal() { try { return JSON.parse(store.get(KEY(), "{}")); } catch (e) { return {}; } }
const norm = (s) => String(s).trim().toLowerCase().replace(/[.!?]+$/, "").replace(/\s+/g, " ");
const isRight = (ans, v) => [].concat(ans).some((a) => norm(a) === norm(v));
const has = (v) => v !== undefined && v !== "" && !(Array.isArray(v) && !v.length);

      t.items.map((it, k) => `<div class="card task" id="it-${esc(it.id)}"><p class="q">${k + 1}. ${esc(it.prompt)}</p>${body(it)}<div class="res" id="r-${esc(it.id)}"></div></div>`).join("") +
      `<button class="btn green press" id="send-tasks">${ic("check")}Отправить ответы</button>`}`;

function count() {
  const t = D.tasks, n = t.items.filter((it) => has(ANS[it.id])).length;

function body(it) {
  const v = ANS[it.id] ?? "";
  if (it.type === "choice") return `<div class="opts">${it.options.map((o) => `<button class="chip" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  if (it.type === "gap") return `<input value="${esc(v)}" placeholder="слово${it.hint ? ", подсказка: " + esc(it.hint) : ""}"><div class="opts" style="margin-top:10px"><button class="chip" data-check>Проверить</button></div>`;
  if (it.type === "fix") return `<textarea placeholder="исправленная фраза целиком">${esc(v)}</textarea>`;
  if (it.type === "timer") return `<div class="timer" data-t>${fmt(it.rounds[0])}</div><div class="opts">${it.rounds.map((s, i) => `<button class="chip" data-r="${i}">Раунд ${i + 1}: ${fmt(s)}</button>`).join("")}<button class="chip" data-stop>Стоп</button></div><p class="mut" style="margin-top:8px">Говори голосовым в чат бота, таймер держит время.</p>`;
  return `<p class="mut">Неизвестный тип задания: ${esc(it.type)}</p>`;
}

const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
let TIMER = null;

function wire(it) {
  const box = $(`#it-${CSS.escape(it.id)}`), res = $(`#r-${CSS.escape(it.id)}`);
  const save = (v) => { ANS[it.id] = v; saveLocal(); count(); };
  const verdict = (v) => {
    if (it.answer === undefined) { res.textContent = "Сохранено, проверит репетитор."; return; }
    const ok = isRight(it.answer, v); haptic(ok ? "light" : "rigid");
    res.innerHTML = ok ? `<span class="up">Верно!</span>` : `<span class="down">Верно: ${esc([].concat(it.answer)[0])}</span>`;
  };
  if (it.type === "choice") {
    $$("[data-o]", box).forEach((b) => {
      if (ANS[it.id] === b.dataset.o) { b.classList.add("on"); verdict(b.dataset.o); }
      b.onclick = () => { $$("[data-o]", box).forEach((x) => x.classList.remove("on")); b.classList.add("on"); save(b.dataset.o); verdict(b.dataset.o); };
    });
  } else if (it.type === "gap") {
    const inp = $("input", box);
    inp.oninput = () => { save(inp.value); res.textContent = ""; };
    $("[data-check]", box).onclick = () => {
      if (!inp.value.trim()) { res.innerHTML = `<span class="down">Сначала впиши слово.</span>`; return; }
      save(inp.value); verdict(inp.value);
    };
  } else if (it.type === "fix") {
    const ta = $("textarea", box);
    ta.oninput = () => { save(ta.value); res.textContent = "Сохранено, проверит репетитор."; };
  } else if (it.type === "timer") {
    const out = $("[data-t]", box), done = new Set(ANS[it.id] || []);
    if (done.size) res.textContent = `Пройдено раундов: ${[...done].map((i) => i + 1).join(", ")}`;
    $$("[data-r]", box).forEach((b) => b.onclick = () => {
      clearInterval(TIMER);
      const i = +b.dataset.r; let left = it.rounds[i];
      out.textContent = fmt(left); res.textContent = `Идет раунд ${i + 1}. Говори!`;
      TIMER = setInterval(() => {
        left -= 1; out.textContent = fmt(Math.max(left, 0));
        if (left <= 0) {
          clearInterval(TIMER); done.add(i); save([...done].sort());
          res.textContent = `Раунд ${i + 1} закончен. Пройдено: ${[...done].map((x) => x + 1).join(", ")}`;
          try { IN_TG && TG.HapticFeedback.notificationOccurred("success"); } catch (e) {}
        }
      }, 1000);
    });
    $("[data-stop]", box).onclick = () => { clearInterval(TIMER); res.textContent = "Остановлено, раунд не засчитан."; };
  }
}

      <div class="kpi c-honey">${ic("zap")}<b data-count="${D.xp.total}">0</b><span class="mut">опыта всего</span></div>
      <div class="kpi c-coral">${ic("flame")}<b>${D.streak[0]}</b><span class="mut">дн. подряд, рекорд ${D.streak[1]}</span></div>
      <div class="kpi" style="--t-fg:${LEAGUE_COLORS[D.xp.lg.k]}">${ic("gem")}<b>${esc(D.xp.lg.name)}</b><span class="mut">лучшая ${esc(LEAGUES[D.xp.lg.best])}</span></div>
      <div class="kpi c-plum">${ic("trophy")}<b>${got}</b><span class="mut">из ${D.ach.length} наград</span></div></div>
    <div class="card"><h3>Форма ${f.now}</h3><p class="mut">Как рейтинг в игре: растет от хороших дней, пропуск снимает 10%, воскресенье не снимает</p>${chart(f.s, [f.start, "сегодня"], { min: 0, area: true })}</div>
    <div class="card"><h3>Темп речи</h3><p class="mut">слов в минуту</p>${chart(rec.map((r) => r[1]), rec.map((r) => r[0]), { area: true })}</div>
    <div class="card"><h3>Паузы длиннее 2 с</h3><p class="mut">в минуту, чем ниже, тем лучше</p>${chart(rec.map((r) => r[2]), rec.map((r) => r[0]), { min: 0 })}</div>
    <div class="card"><h3>Past simple верно</h3><p class="mut">в рассказах, %</p>${chart(ps.map((r) => r[1]), ps.map((r) => r[0]), { suffix: "%", min: 0, max: 100 })}</div>
    ${pr.length ? `<h2>Сцены</h2>${pr.map(([s, v]) => `<div class="row c-${catColor(s)}" style="box-shadow:none"><div class="dot">${ic(s.icon)}</div><div class="tx"><h3>${esc(s.title)}</h3><p>${v[0]} раз${v[2] ? `, лучшее ${v[1]} из ${v[2]} целей` : ""}</p></div></div>`).join("")}` : ""}
    <h2>Награды</h2>
    <div class="card"><div class="ach">${D.ach.map(([t, g, p]) => `<div class="${g ? "got" : "no"}">${ic(g ? "trophy" : "lock")}<div>${esc(t)}<span>${esc(p)}</span></div></div>`).join("")}</div></div>`;
}

// ───────────── старт
(async () => {
  const z = new URLSearchParams((window.__HASH || "").slice(1)).get("z");
  const catP = fetch("scenarios.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((c) => { CAT = c; }).catch((e) => showErr([`Сценарии не загрузились: ${e.message || e}`]));
  if (!z) showErr(["В ссылке нет данных. Открой мини-апп кнопкой «📊 Прогресс» в чате бота (/app обновит кнопку)."]);
  else {
    try { D = await decode(z); showErr(D.err || []); }
    catch (e) { showErr([`Данные в ссылке повреждены (${e.message || e}). Отправь боту /app и открой новую кнопку.`]); }
  }
  await catP;
  renderLearn(); renderPractice(); renderStats(); renderHome();
  tab("home");
  setTimeout(celebrate, 700);
})().catch((e) => showErr([`Сбой страницы: ${e.message || e}`]));
window.addEventListener("error", (e) => showErr([`Сбой страницы: ${e.message}`]));
</script>
</body>
</html>
